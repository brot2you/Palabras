const KEY='palabras-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch{};let state={page:'inicio',grade:Number(saved.grade)||5,theme:'familia',quiz:null,answered:false,story:0};const progress=saved.progress||{};const $=s=>document.querySelector(s);const all=()=>DATA.flatMap(t=>t[4].map((w,i)=>({id:t[0]+':'+i,theme:t[0],level:t[3],es:w[0],fr:w[1],emoji:w[2],example:w[3]})));const available=()=>all().filter(w=>w.level>=state.grade);function persist(){saved.grade=state.grade;saved.progress=progress;localStorage.setItem(KEY,JSON.stringify(saved))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function say(s){if(!('speechSynthesis'in window))return alert('Synthèse vocale indisponible sur ce navigateur.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='es-ES';u.rate=.84;speechSynthesis.speak(u)}function go(page){state.page=page;state.answered=false;render()}function setGrade(g){state.grade=Number(g);persist();render()}function setTheme(t){state.theme=t;go('words')}function mark(id){progress[id]=(progress[id]||0)+1;persist();render()}function level(w){return Math.min(4,progress[w.id]||0)}function stats(){let ws=available();return {total:ws.length,seen:ws.filter(w=>level(w)>0).length,mastered:ws.filter(w=>level(w)>=4).length}}function nav(){return [['inicio','🏠 Inicio'],['biblioteca','📚 Biblioteca'],['juegos','🎮 Juegos'],['repasos','🧠 Repasos'],['diccionario','📖 Diccionario'],['progreso','🏆 Progreso'],['aventura','💬 Mi barrio']].map(([p,t])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}function wordCard(w){return `<article class="word"><span class="symbol">${w.emoji}</span><strong>${escapeHtml(w.es)}</strong><span class="muted">${escapeHtml(w.fr)}</span><small>${escapeHtml(w.example)}</small><div class="actions"><button onclick="say('${w.id}')" data-speak="${w.id}">🔊 Escuchar</button><button onclick="mark('${w.id}')">⭐ ${level(w)}/4</button></div></article>`}function speech(id){let w=all().find(x=>x.id===id);if(w)say(w.es)}
function render(){const s=stats();$('#grade').value=String(state.grade);$('#nav').innerHTML=nav();let h='';if(state.page==='inicio'){h=`<section class="panel hero"><div><span class="pill">¡Bienvenido a tu mundo!</span><h2>Aprende español, palabra a palabra.</h2><p>Explora, escucha, juega y descubre aventuras con Lucía y sus amigos.</p><div class="actions"><button class="primary" onclick="go('biblioteca')">📚 Explorar palabras</button><button onclick="go('aventura')">💬 Leer una BD</button></div><p><b>${s.seen}</b> palabras descubiertas · <b>${s.mastered}</b> dominadas</p></div><img src="assets/concept.png" alt="Univers graphique de ¡PALABRAS!" onerror="this.style.display='none'"></section><section class="panel"><h2>¿Qué hacemos hoy?</h2><div class="grid"><button class="tile" onclick="go('biblioteca')"><span class="emoji">📚</span><b>Mi biblioteca</b><small>Explorar el vocabulario</small></button><button class="tile" onclick="startQuiz('es')"><span class="emoji">🎮</span><b>Un desafío</b><small>Jugar y recordar</small></button><button class="tile" onclick="go('repasos')"><span class="emoji">🧠</span><b>Mis repasos</b><small>Revisar mis palabras</small></button><button class="tile" onclick="go('aventura')"><span class="emoji">💬</span><b>Mi barrio</b><small>Leer una aventura</small></button></div></section>`}
if(state.page==='biblioteca'){h=`<section class="panel"><h2>📚 Mi biblioteca</h2><p>Choisis un thème. Les thèmes des niveaux précédents restent disponibles.</p><div class="grid">${DATA.filter(t=>t[3]>=state.grade).map(t=>`<button class="tile" onclick="setTheme('${t[0]}')"><span class="emoji">${t[1]}</span><b>${t[2]}</b><small>${t[4].length} palabras · ${t[3]}e</small></button>`).join('')}</div></section>`}
if(state.page==='words'){let t=DATA.find(t=>t[0]===state.theme);h=`<section class="panel"><button onclick="go('biblioteca')">← Biblioteca</button><h2 style="margin-top:16px">${t[1]} ${t[2]}</h2><p>Écoute, observe et entraîne-toi. Chaque étoile représente une rencontre réussie avec le mot.</p><div class="grid">${all().filter(w=>w.theme===t[0]).map(wordCard).join('')}</div><p><button class="primary" onclick="startQuiz('es','${t[0]}')">🎮 Practicar este tema</button></p></section>`}

if(state.page==='juegos'){h=`<section class="panel"><h2>🎮 Mis juegos</h2><p>Deux modes de rappel actifs dans cette V1. Les autres ateliers seront ajoutés ensuite.</p><div class="grid"><button class="tile" onclick="startQuiz('es')"><span class="emoji">🧩</span><b>Encuentra la palabra</b><small>Français → espagnol</small></button><button class="tile" onclick="startQuiz('fr')"><span class="emoji">🎯</span><b>¿Qué significa?</b><small>Espagnol → français</small></button><button class="tile" onclick="startQuiz('audio')"><span class="emoji">🔊</span><b>Escucha y elige</b><small>Écoute le mot et reconnais-le</small></button></div></section>`}
if(state.page==='quiz'){let q=state.quiz;if(!q){startQuiz('es');return}h=`<section class="panel"><button onclick="go('juegos')">← Juegos</button><h2 style="margin-top:20px">${q.mode==='audio'?'🔊 Escucha y elige':q.mode==='fr'?'¿Qué significa?':'Encuentra la palabra'}</h2><p>Pregunta ${q.index+1} / ${q.questions.length} · ${q.score} puntos</p><div class="bar"><span style="width:${100*q.index/q.questions.length}%"></span></div><h2 style="margin-top:24px">${q.mode==='audio'?`<button class="primary" onclick="speech('${q.current.id}')">🔊 Escuchar</button>`:escapeHtml(q.mode==='fr'?q.current.es:q.current.fr)}</h2><div class="choices">${q.options.map((o,i)=>`<button ${state.answered?'disabled':''} onclick="answer(${i})">${escapeHtml(q.mode==='fr'?o.fr:o.es)}</button>`).join('')}</div><p class="feedback" id="feedback"></p>${state.answered?'<button class="primary" onclick="nextQuestion()">Siguiente →</button>':''}</section>`}

if(state.page==='repasos'){let due=available().filter(w=>level(w)<4).sort((a,b)=>level(a)-level(b));h=`<section class="panel"><h2>🧠 Mis repasos</h2><p>Entraîne-toi sur les mots non encore maîtrisés. La V1 utilise un suivi local simplifié ; une planification temporelle des révisions sera ajoutée ensuite.</p><p><b>${due.length}</b> mots à consolider.</p><button class="primary" onclick="startQuiz('es',null,true)">Comenzar el repaso</button><div class="grid" style="margin-top:20px">${due.slice(0,12).map(wordCard).join('')}</div></section>`}
if(state.page==='progreso'){let p=Math.round(100*s.mastered/Math.max(1,s.total));h=`<section class="panel"><h2>🏆 Mi progreso</h2><p><b>${s.seen}</b> mots découverts sur ${s.total} disponibles · <b>${s.mastered}</b> maîtrisés.</p><div class="bar"><span style="width:${p}%"></span></div><p>${p}% du lexique disponible maîtrisé.</p><button onclick="exportProgress()">⬇️ Exportar progreso</button> <button onclick="$('#importFile').click()">⬆️ Importar progreso</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importProgress(event)"><h3 style="margin-top:25px">Progreso por tema</h3><div class="grid">${DATA.filter(t=>t[3]>=state.grade).map(t=>{let ws=all().filter(w=>w.theme===t[0]);return `<div class="word"><b>${t[1]} ${t[2]}</b><span>${ws.filter(w=>level(w)>=4).length}/${ws.length} dominadas</span></div>`}).join('')}</div></section>`}
if(state.page==='aventura'){let scenes=[['👧','¡Hola! Soy Lucía. ¿Cómo te llamas?','Bonjour ! Je suis Lucía. Comment t’appelles-tu ?'],['👦','Me llamo Mateo. ¡Mucho gusto!','Je m’appelle Mateo. Enchanté !'],['👧','¿Te gusta el instituto?','Tu aimes le collège ?'],['👦','Sí, me gusta mucho. ¿Y a ti?','Oui, j’aime beaucoup. Et toi ?']];let scene=scenes[state.story%scenes.length];h=`<section class="panel"><span class="pill">Episodio 1 · Un nuevo compañero</span><h2 style="margin-top:12px">💬 Mi barrio</h2><p>Découvre la première mini-BD et écoute les dialogues.</p><div class="comic"><div class="frame"><div class="face">👧</div><div class="bubble">¡Hola! Soy Lucía.</div><small>En el instituto</small></div><div class="frame"><div class="face">👦</div><div class="bubble">Me llamo Mateo.</div><small>Un nuevo compañero</small></div><div class="frame"><div class="face">👧👦</div><div class="bubble">¡Mucho gusto!</div><small>Una nueva amistad</small></div></div><div class="panel" style="margin-top:20px"><h3>Diálogo interactivo · ${state.story%scenes.length+1}/4</h3><div class="bubble"><b>${scene[0]} ${scene[1]}</b></div><button onclick="sayScene()">🔊 Escuchar</button> <button onclick="toggleTranslation()">🇫🇷 Traduction</button><p id="translation" class="hidden">${scene[2]}</p><button class="primary" onclick="state.story++;render()">Siguiente →</button></div><button onclick="setTheme('escuela')">📚 Aprender vocabulario escolar</button></section>`}
$('#view').innerHTML=h;if(state.page==='diccionario')filterWords();if(state.page==='quiz'&&state.answered)$('#feedback').textContent=state.lastFeedback||'';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speech(b.dataset.speak))}
function filterWords(){let term=($('#search')?.value||'').toLocaleLowerCase();let t=$('#filter')?.value||'all';let ws=available().filter(w=>(t==='all'||w.theme===t)&&(w.es.toLocaleLowerCase().includes(term)||w.fr.toLocaleLowerCase().includes(term)));$('#wordList').innerHTML=ws.map(wordCard).join('')||'<p>No hay resultados.</p>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speech(b.dataset.speak))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startQuiz(mode,theme=null,review=false){let pool=available().filter(w=>(!theme||w.theme===theme)&&(!review||level(w)<4));if(pool.length<4)pool=available();let questions=shuffle(pool).slice(0,Math.min(10,pool.length));state.quiz={mode,questions,index:0,score:0};state.answered=false;state.page='quiz';buildQuestion()}
function buildQuestion(){let q=state.quiz;if(q.index>=q.questions.length){go('result');return}q.current=q.questions[q.index];let opts=shuffle(available().filter(w=>w.id!==q.current.id));let unique=[];let field=q.mode==='fr'?'fr':'es';for(let w of opts){if(!unique.some(x=>x[field]===w[field]))unique.push(w);if(unique.length===3)break}q.options=shuffle([q.current,...unique]);state.answered=false;render()}
function answer(i){if(state.answered)return;let q=state.quiz;let correct=q.options[i].id===q.current.id;state.answered=true;if(correct){q.score++;progress[q.current.id]=Math.min(4,(progress[q.current.id]||0)+1);persist()}else{progress[q.current.id]=Math.max(0,(progress[q.current.id]||0)-1);persist()}state.lastFeedback=correct?'✅ ¡Correcto! '+q.current.es+' = '+q.current.fr:'💡 La bonne réponse : '+q.current.es+' = '+q.current.fr;render()}
function nextQuestion(){state.quiz.index++;buildQuestion()}function sayScene(){let lines=['¡Hola! Soy Lucía. ¿Cómo te llamas?','Me llamo Mateo. ¡Mucho gusto!','¿Te gusta el instituto?','Sí, me gusta mucho. ¿Y a ti?'];say(lines[state.story%4])}function toggleTranslation(){$('#translation').classList.toggle('hidden')}function exportProgress(){let blob=new Blob([JSON.stringify({app:'palabras-v1',grade:state.grade,progress},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='palabras-progreso.json';a.click();URL.revokeObjectURL(a.href)}function importProgress(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.app!=='palabras-v1'||!obj.progress||typeof obj.progress!=='object'||Array.isArray(obj.progress))throw Error('Format incorrect');for(let [id,n] of Object.entries(obj.progress)){if(all().some(w=>w.id===id)&&Number.isInteger(n)&&n>=0&&n<=4)progress[id]=n}if([3,4,5].includes(Number(obj.grade)))state.grade=Number(obj.grade);persist();render();alert('Progreso importado.')}catch{alert('Fichier de progression invalide.')}};r.readAsText(f)}document.querySelector('#grade').addEventListener('change',e=>setGrade(e.target.value));render();
</script></body></html>
