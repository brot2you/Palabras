,["compartirá","compartiré","compartirán"],0,"Demain, Pablo partagera les informations."],["Los jóvenes ___ hablar con la IA.",["poderán","podrán","podremos"],1,"Les jeunes pourront parler avec l'IA."]]},{"id":"p-indefinido","nivel":3,"lugar":"museo","titulo":"Raconter au passé : le pretérito indefinido","explica":["Pour raconter une action terminée dans le passé (*ayer, el año pasado, en 1937…*), on utilise le **pretérito indefinido**.","Verbes en **-ar** : -é, -aste, -ó, -amos, -asteis, -aron. Verbes en **-er / -ir** : -í, -iste, -ió, -imos, -isteis, -ieron. Attention à l'accent : *visito* (je visite) n'est pas *visitó* (il a visité). **Ir** et **ser** ont la même forme : *fui, fuiste, fue…* Et **hacer** donne *hice, hiciste, hizo…*"],"tabla":[["","visitar","nacer","ir / ser"],["yo","visit**é**","nac**í**","fui"],["tú","visit**aste**","nac**iste**","fuiste"],["él / ella","visit**ó**","nac**ió**","fue"],["nosotros","visit**amos**","nac**imos**","fuimos"],["vosotros","visit**asteis**","nac**isteis**","fuisteis"],["ellos / ellas","visit**aron**","nac**ieron**","fueron"]],"ejemplos":[["Fui al museo con mi clase.","Je suis allé au musée avec ma classe."],["Picasso pintó el Guernica en 1937.","Picasso a peint Guernica en 1937."],["¿Qué hiciste el fin de semana?","Qu'as-tu fait ce week-end ?"]],"ejercicio":[["Ayer yo ___ el museo.",["visité","visito","visitó"],0,"Hier, j'ai visité le musée."],["Picasso ___ el Guernica en 1937.",["pinté","pintó","pinta"],1,"Picasso a peint Guernica en 1937."],["Frida Kahlo ___ en 1907.",["nací","nació","nacieron"],1,"Frida Kahlo est née en 1907."],["El año pasado nosotros ___ a Bogotá.",["fuimos","fueron","vamos"],0,"L'an dernier, nous sommes allés à Bogotá."],["¿Qué ___ tú el sábado?",["hice","hiciste","hizo"],1,"Qu'as-tu fait samedi ?"],["Mis padres ___ el cuadro.",["descubrió","descubrieron","descubrimos"],1,"Mes parents ont découvert le tableau."]]},{"id":"p-obligacion","nivel":3,"lugar":"huerto","titulo":"Exprimer l'obligation","explica":["Trois façons de dire ce qu'il faut faire : **hay que + infinitif** (il faut, de façon générale), **tener que + infinitif** (devoir, pour une personne précise) et **deber + infinitif** (devoir, sens moral).","*Hay que reciclar.* (il faut recycler, en général) / *Tengo que regar las plantas.* (je dois arroser) / *Debemos proteger el planeta.* (nous devons protéger la planète)."],"tabla":[["","tener que","deber"],["yo","tengo que","debo"],["tú","tienes que","debes"],["él / ella","tiene que","debe"],["nosotros","tenemos que","debemos"],["vosotros","tenéis que","debéis"],["ellos / ellas","tienen que","deben"]],"ejemplos":[["Hay que ahorrar agua.","Il faut économiser l'eau."],["Tenemos que cuidar el planeta.","Nous devons prendre soin de la planète."],["Todos debemos reciclar.","Nous devons tous recycler."]],"ejercicio":[["___ que reciclar el plástico.",["Hay","Tiene","Debe"],0,"Il faut recycler le plastique."],["Yo tengo ___ regar las plantas.",["de","que","a"],1,"Je dois arroser les plantes."],["Nosotros ___ que ahorrar agua.",["tenemos","tienen","hay"],0,"Nous devons économiser l'eau."],["Los ciudadanos ___ proteger la naturaleza.",["debe","deben","debemos"],1,"Les citoyens doivent protéger la nature."],["Sofía ___ que plantar tomates.",["tiene","tienes","hay"],0,"Sofía doit planter des tomates."],["Para salvar el planeta, ___ usar menos plástico.",["hay que","tengo","debe que"],0,"Pour sauver la planète, il faut utiliser moins de plastique."]]},{"id":"p-opinion","nivel":3,"lugar":"ayuntamiento","titulo":"Donner son avis et argumenter","explica":["Pour donner ton avis : **creo que, pienso que, en mi opinión, me parece que** + indicatif. *Creo que es una buena idea.*","Pour argumenter, relie tes idées : **además** (de plus), **sin embargo** (cependant), **por eso** (c'est pourquoi), **porque** (parce que). Pour réagir : **estoy de acuerdo / no estoy de acuerdo**. Après *no creo que*, on emploie le subjonctif : ce sera pour plus tard !"],"tabla":[["pour…","on dit"],["donner son avis","creo que, pienso que, en mi opinión"],["ajouter","además, también"],["opposer","sin embargo, pero"],["conclure","por eso, entonces"],["réagir","estoy de acuerdo, no estoy de acuerdo"]],"ejemplos":[["En mi opinión, hay mucha contaminación.","À mon avis, il y a beaucoup de pollution."],["No estoy de acuerdo.","Je ne suis pas d'accord."],["Además, podemos crear un carril bici.","De plus, nous pouvons créer une piste cyclable."]],"ejercicio":[["___ que es una buena idea.",["Creo","Además","Por eso"],0,"Je crois que c'est une bonne idée."],["Hay mucho ruido. ___, hay que cerrar la plaza.",["Sin embargo","Por eso","Porque"],1,"Il y a beaucoup de bruit. C'est pourquoi il faut fermer la place."],["Es una buena idea; ___, es cara.",["sin embargo","además","por eso"],0,"C'est une bonne idée ; cependant, elle coûte cher."],["No estoy ___ acuerdo contigo.",["en","de","a"],1,"Je ne suis pas d'accord avec toi."],["Cierro la plaza ___ hay mucha contaminación.",["porque","además","sin embargo"],0,"Je ferme la place parce qu'il y a beaucoup de pollution."],["Es bueno para el planeta. ___, es bueno para la salud.",["Además","Sin embargo","Pero"],0,"C'est bon pour la planète. De plus, c'est bon pour la santé."]]}]}</script>
<script>
(function(){
'use strict';

/* ---------- Data ---------- */
var D = JSON.parse(document.getElementById('palabras-data').textContent);
var KEY = 'palabras-v3';
var INT = [0, 1, 2, 4, 8, 16];
var app = document.getElementById('app');

var VEC = {}, LUG = {}, PIS = {}, WORDS = [], BYID = {};
var ART_RE = /^(el|la|los|las) (.+)$/;

function mkWord(l, p, i){
  var forms = p[0].split(' / ');
  var main = forms[0];
  var mw = main.split(' ');
  for (var q = 1; q < forms.length; q++){
    if (forms[q].indexOf(' ') < 0 && mw.length > 1 && !ART_RE.test(main)) forms[q] = mw.slice(0, -1).join(' ') + ' ' + forms[q];
  }
  var m = ART_RE.exec(main);
  var flags = p[5] || {};
  var w = {id: l.id + ':' + i, lugar: l.id, nivel: l.nivel, es: p[0], fr: p[1], e: p[2], ej: p[3], ejfr: p[4],
    forms: forms, main: main, art: m ? m[1] : null, bare: m ? m[2] : main};
  var noun = !!m && !flags.nog;
  for (var k = 1; k < forms.length; k++){
    var m2 = ART_RE.exec(forms[k]);
    if (m2 && m && m2[1] !== m[1]) noun = false;
  }
  w.noun = noun;
  w.typable = main.indexOf('…') < 0 && !/[¿¡?!]/.test(main) && main.split(' ').length <= 3;
  w.tokens = p[3].split(' ');
  w.orderable = w.tokens.length >= 4 && w.tokens.length <= 9;
  return w;
}
D.vecinos.forEach(function(v){ VEC[v.id] = v; });
D.lugares.forEach(function(l){
  LUG[l.id] = l; l.words = [];
  l.palabras.forEach(function(p, i){ var w = mkWord(l, p, i); l.words.push(w); WORDS.push(w); BYID[w.id] = w; });
});
D.pistas.forEach(function(p){ PIS[p.id] = p; });

/* ---------- State ---------- */
function defaults(){
  return {grade: 5, w: {}, ep: {}, pista: {}, cfg: {font: 'std', size: 0, spacing: 0, rate: 0.9, voz: 'es', acentos: 1, motor: 'auto'}};
}
function load(){
  var s = defaults();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && typeof o === 'object'){
        if ([3,4,5].indexOf(Number(o.grade)) >= 0) s.grade = Number(o.grade);
        if (o.w && typeof o.w === 'object') s.w = o.w;
        if (o.ep && typeof o.ep === 'object') s.ep = o.ep;
        if (o.pista && typeof o.pista === 'object') s.pista = o.pista;
        if (o.cfg && typeof o.cfg === 'object'){ for (var k in s.cfg){ if (o.cfg.hasOwnProperty(k)) s.cfg[k] = o.cfg[k]; } }
      }
    }
  } catch (e) {}
  return s;
}
var S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

var view = {page: 'inicio', lugar: null, tab: 'episodio', scope: 'nivel', pista: null};
var G = null;      // current game
var EP = null;     // current episode
var PX = null;     // current grammar exercise

/* ---------- Helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>'); }
function shuffle(a){ var b = a.slice(), i, j, t; for (i = b.length - 1; i > 0; i--){ j = Math.floor(Math.random() * (i + 1)); t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function findIn(arr, fn){ for (var i = 0; i < arr.length; i++){ if (fn(arr[i])) return arr[i]; } return null; }
function ico(name, cls){ return '<img class="' + (cls || 'ico') + '" src="assets/' + name + '.webp" alt="" aria-hidden="true">'; }
function portrait(id, cls){
  if (VEC[id]) return '<img class="' + (cls || 'avatar') + '" src="assets/p-' + id + '.webp" alt="' + esc(VEC[id].nombre) + '">';
  var x = D.extras[id];
  return '<span class="' + (cls || 'avatar') + '" role="img" aria-label="' + esc(x ? x.nombre : '') + '">' + (x ? x.avatar : '🙂') + '</span>';
}
function speakerName(id){ return VEC[id] ? VEC[id].nombre : (D.extras[id] ? D.extras[id].nombre : id); }
function nivelLabel(n){ return n + 'e'; }
function fold(s){
  return String(s).replace(/[áàâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[íìîï]/g,'i').replace(/[óòôö]/g,'o').replace(/[úùûü]/g,'u').replace(/ñ/g,'n');
}
function clean(s){ return String(s).toLowerCase().replace(/[¡¿]/g,'').replace(/[.!?,;:]+$/,'').replace(/\s+/g,' ').replace(/^\s+|\s+$/g,''); }
function isLetter(c){ return /[a-záéíóúüñ]/i.test(c); }
function today(){ var d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }

/* ---------- Spaced repetition ---------- */
function st(id){ return S.w[id] || {b: 0, n: 0}; }
function record(id, ok){
  var s = st(id);
  s.b = ok ? Math.min(5, s.b + 1) : 1;
  s.n = today() + INT[s.b];
  S.w[id] = s; save();
}
function touch(id){ var s = st(id); if (s.b === 0){ s.b = 1; s.n = today(); } S.w[id] = s; save(); }
function seen(id){ return st(id).b > 0; }
function mastered(id){ return st(id).b >= 4; }
function isDue(w){ var s = st(w.id); return s.b > 0 && s.n <= today(); }
function open(l){ return l.nivel >= S.grade; }
function available(){ return WORDS.filter(function(w){ return open(LUG[w.lugar]); }); }
function lugarStats(l){
  var s = 0, m = 0;
  l.words.forEach(function(w){ if (seen(w.id)) s++; if (mastered(w.id)) m++; });
  return {n: l.words.length, s: s, m: m, ep: S.ep[l.id] || 0};
}
function medal(l){
  var x = lugarStats(l);
  if (x.ep >= 2 && x.m / x.n >= 0.8) return 'oro';
  if (x.ep >= 2) return 'plata';
  if (x.s > 0) return 'visto';
  return 'nuevo';
}
var MEDAL_TXT = {oro: 'Or', plata: 'Argent', visto: 'Commencé', nuevo: 'Nouveau'};
function vecinoUnlocked(id){
  for (var i = 0; i < D.lugares.length; i++){ var l = D.lugares[i]; if (l.guia === id && (S.ep[l.id] || 0) >= 2) return true; }
  return false;
}
function dueCount(){ return available().filter(isDue).length; }

/* ---------- Speech ----------
   The browser voice is only used if it is really Spanish. Otherwise (no Spanish voice
   installed, or voice list not ready), the app plays an online Spanish voice instead of
   letting the browser read Spanish with its default French voice. */
var VOICES = [];
var HAS_TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
var currentAudio = null, onlineFailed = false, helpShown = false;
function loadVoices(){ if (HAS_TTS){ try { VOICES = window.speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } } }
if (HAS_TTS){ loadVoices(); if ('onvoiceschanged' in window.speechSynthesis) window.speechSynthesis.onvoiceschanged = loadVoices; }
function voiceLang(v){ return String(v.lang || '').replace('_', '-').toLowerCase(); }
function spanishVoices(){ loadVoices(); return VOICES.filter(function(v){ return voiceLang(v).indexOf('es') === 0; }); }
function pickVoice(lang){
  var L = lang.toLowerCase(), list = spanishVoices(), i, vl, spain = null, latam = null;
  if (!list.length) return null;
  for (i = 0; i < list.length; i++){
    vl = voiceLang(list[i]);
    if (vl === L) return list[i];
    if (vl === 'es-es'){ if (!spain) spain = list[i]; } else if (!latam) latam = list[i];
  }
  if (L !== 'es-es' && latam) return latam;
  return spain || latam || list[0];
}
function whenVoicesReady(cb){
  if (!HAS_TTS || VOICES.length){ cb(); return; }
  var tries = 0;
  (function wait(){ loadVoices(); if (VOICES.length || tries++ > 12) cb(); else setTimeout(wait, 100); })();
}
function engine(){
  var m = S.cfg.motor || 'auto';
  if (m === 'online') return 'online';
  if (m === 'local') return (HAS_TTS && spanishVoices().length) ? 'local' : 'none';
  return (HAS_TTS && spanishVoices().length) ? 'local' : 'online';
}
function stopAudio(){
  if (HAS_TTS){ try { window.speechSynthesis.cancel(); } catch (e) {} }
  if (currentAudio){ try { currentAudio.onended = null; currentAudio.onerror = null; currentAudio.pause(); } catch (e) {} currentAudio = null; }
}
function showVoiceHelp(){
  if (helpShown) return; helpShown = true;
  openModal('Installer une voix espagnole', voiceHelpHtml());
}
function voiceHelpHtml(){
  return '<p>Cet appareil n\u2019a pas de voix espagnole, et la voix en ligne n\u2019est pas joignable (pas de connexion, ou réseau qui la bloque). Sans voix espagnole, l\u2019appli préfère se taire plutôt que de lire l\u2019espagnol avec une voix française.</p>' +
    '<h3>Ajouter une voix espagnole (gratuit)</h3><ul>' +
    '<li><b>iPhone, iPad :</b> Réglages, Accessibilité, Contenu énoncé, Voix, puis Espagnol (Espagne ou Mexique).</li>' +
    '<li><b>Android :</b> Paramètres, Accessibilité (ou Langues et saisie), Synthèse vocale, moteur Google, Installer les données vocales, Espagnol.</li>' +
    '<li><b>Windows :</b> Paramètres, Heure et langue, Voix, Ajouter des voix, Español.</li>' +
    '<li><b>Mac :</b> Réglages Système, Accessibilité, Contenu énoncé, Voix du système, Gérer les voix, Espagnol.</li></ul>' +
    '<p>Ensuite, recharge la page.</p>';
}
function splitText(t){
  if (t.length <= 180) return [t];
  var parts = t.split(/([.!?;,] )/), out = [], cur = '';
  for (var i = 0; i < parts.length; i++){
    if ((cur + parts[i]).length > 180 && cur){ out.push(cur); cur = ''; }
    cur += parts[i];
  }
  if (cur) out.push(cur);
  return out;
}
function onlineUrl(text){
  return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=' + encodeURIComponent(text);
}
function playOnline(list, i){
  if (i >= list.length) return;
  var a = new Audio(onlineUrl(list[i].text));
  currentAudio = a;
  try { a.playbackRate = Number(S.cfg.rate) < 0.85 ? 0.8 : 1; } catch (e) {}
  a.onended = function(){ if (currentAudio === a) setTimeout(function(){ playOnline(list, i + 1); }, 200); };
  a.onerror = function(){ if (currentAudio !== a) return; onlineFailed = true; showVoiceHelp(); };
  var pr = a.play();
  if (pr && pr.catch) pr.catch(function(err){ if (err && err.name === 'NotAllowedError') return; onlineFailed = true; showVoiceHelp(); });
}
function playLocal(list){
  var i = 0;
  function next(){
    if (i >= list.length) return;
    var it = list[i]; i++;
    var v = pickVoice(it.lang);
    var u = new SpeechSynthesisUtterance(it.text);
    u.voice = v; u.lang = v.lang;
    u.rate = Number(S.cfg.rate) || 0.9;
    u.onend = function(){ setTimeout(next, 250); };
    window.speechSynthesis.speak(u);

function markLine(text, l){
  var forms = [];
  l.words.forEach(function(w){
    w.forms.forEach(function(f){
      var b = f.replace(ART_RE, '$2').replace(/…/g, '').replace(/[¿?¡!]/g, '').replace(/^\s+|\s+$/g, '');
      if (b.length >= 3) forms.push({f: b.toLowerCase(), id: w.id});
    });
  });
  forms.sort(function(a, b){ return b.f.length - a.f.length; });
  var low = text.toLowerCase(), marks = [], taken = [];
  function free(s, e){ for (var i = s; i < e; i++){ if (taken[i]) return false; } return true; }
  forms.forEach(function(fo){
    var idx = low.indexOf(fo.f);
    while (idx >= 0){
      var end = idx + fo.f.length;
      var before = idx === 0 ? ' ' : low.charAt(idx - 1), aft = end >= low.length ? ' ' : low.charAt(end);
      if (!isLetter(before) && !isLetter(aft) && free(idx, end)){
        marks.push({s: idx, e: end, id: fo.id});
        for (var k = idx; k < end; k++) taken[k] = true;
      }
      idx = low.indexOf(fo.f, idx + 1);
    }
  });
  marks.sort(function(a, b){ return a.s - b.s; });
  var out = '', pos = 0;
  marks.forEach(function(m){
    out += esc(text.slice(pos, m.s)) + '<button class="mot" data-act="mot" data-id="' + m.id + '">' + esc(text.slice(m.s, m.e)) + '</button>';
    pos = m.e;
  });
  return out + esc(text.slice(pos));
}

function eligible(type, w){

function startGame(type, scope){

  if (!pool.length){

    return;
  }
  pool = shuffle(pool);
  var keyed = pool.map(function(w, i){ return {w: w, p: prio(w), i: i}; });
  keyed.sort(function(a, b){ return a.p - b.p || a.i - b.i; });
  var items = keyed.slice(0, 10).map(function(k){

function makeOptions(w, field){
  function key(x){ return field === 'es' ? x.main : x.fr; }
  var same = LUG[w.lugar].words.filter(function(x){ return x.id !== w.id && x.noun === w.noun; });
  var other = LUG[w.lugar].words.filter(function(x){ return x.id !== w.id && x.noun !== w.noun; });
  var far = available().filter(function(x){ return x.lugar !== w.lugar; });
  var all = shuffle(same).concat(shuffle(other), shuffle(far));
  var out = [w], used = {};
  used[key(w)] = 1;
  for (var i = 0; i < all.length && out.length < 4; i++){
    var k = key(all[i]);
    if (!used[k]){ used[k] = 1; out.push(all[i]); }
  }
  return shuffle(out);
}
function prepItem(){
  var it = G.items[G.i];

  else if (it.t === 'genero') it.opts = ['el', 'la', 'los', 'las'];

    var sh = shuffle(toks), tries = 0;
    while (tries < 5 && sh.map(function(x){ return x.t; }).join(' ') === it.w.ej){ sh = shuffle(toks); tries++; }
    it.bank = sh; it.built = [];
  }
}

}
function openAjustes(confirmReset){
  var h = '<div class="cfg-row"><span>Police</span>' + seg('font', [['std', 'Standard'], ['lexend', 'Lexend']]) + '</div>' +
    '<div class="cfg-row"><span>Taille du texte</span>' + seg('size', [[0, 'Normale'], [1, 'Grande'], [2, 'Très grande']]) + '</div>' +
    '<div class="cfg-row"><span>Espacement</span>' + seg('spacing', [[0, 'Normal'], [1, 'Large']]) + '</div>' +
    '<div class="cfg-row"><span>Vitesse de la voix</span>' + seg('rate', [[0.7, 'Lente'], [0.9, 'Normale']]) + '</div>' +
    '<div class="cfg-row"><span>Accent des mots</span>' + seg('voz', [['es', 'Espagne'], ['latam', 'Amérique latine']]) + '</div>' +
    '<div class="cfg-row"><span>Chaque voisin parle avec l\u2019accent de son pays</span>' + seg('acentos', [[1, 'Oui'], [0, 'Non']]) + '</div>' +
    '<div class="cfg-row"><span>Source de la voix</span>' + seg('motor', [['auto', 'Automatique'], ['local', 'Appareil'], ['online', 'En ligne']]) + '</div>' +
    '<p class="muted" style="font-size:.88rem;margin:8px 0 0">' + esc(voiceStatus()) + ' Les accents des voisins demandent des voix de ces pays sur l\u2019appareil.</p>' +
    '<div class="row" style="margin:8px 0 6px"><button class="btn small" data-act="test-voz">' + ico('u-sonido') + 'Tester la voix</button><button class="btn small" data-act="voz-help">Installer une voix espagnole</button></div>' +
    '<div class="cfg-row"><span>Progression</span><span class="row"><button class="btn small" data-act="export">Exporter</button><button class="btn small" data-act="import">Importer</button>' +
    (confirmReset ? '<button class="btn small" data-act="reset-yes" style="background:var(--error)">Oui, tout effacer</button><button class="btn small" data-act="ajustes">Annuler</button>'
                  : '<button class="btn small" data-act="reset-ask">Tout effacer</button>') + '</span></div>';
  openModal('Réglages', h);
}
function openVecino(id){
  var v = VEC[id], un = vecinoUnlocked(id);
  var ls = D.lugares.filter(function(l){ return l.guia === id; });
  var h = '<div class="vec-modal">' + portrait(id, 'p') + '<div><p style="margin:0 0 6px"><b>' + esc(v.nombre) + '</b>, ' + v.edad + ' ans, ' + esc(v.ciudad) + ' (' + esc(v.pais) + ')</p>' +
    '<div class="bubble" style="margin-bottom:12px"><p class="es">' + esc(v.frase) + '</p><p class="fr">' + esc(v.frasefr) + '</p><button class="btn small" data-act="say-vec" data-id="' + id + '">' + ico('u-sonido') + 'Escuchar</button></div>' +
    (un ? '<h3>El país de ' + esc(v.nombre) + '</h3><p>' + esc(v.cultura) + '</p>' : '<p class="muted">Réussis un épisode de ' + esc(v.nombre) + ' pour découvrir son pays.</p>') +
    '<div class="row">' + ls.map(function(l){ return '<button class="btn small" data-act="lugar" data-id="' + l.id + '">' + ico(l.icono) + esc(l.nombre) + '</button>'; }).join('') + '</div></div></div>';
  openModal(v.nombre, h);
}

/* Export / import */
function exportProgress(){
  try {
    var blob = new Blob([JSON.stringify({app: KEY, date: new Date().toISOString(), data: S}, null, 1)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'palabras-progression.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast('Fichier de progression téléchargé.');
  } catch (e) { toast('Export impossible sur ce navigateur.'); }
}
$('importFile').addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result);
      if (!o || o.app !== KEY || !o.data || typeof o.data.w !== 'object') throw new Error('format');
      var d = o.data, w = {};
      for (var id in d.w){ if (d.w.hasOwnProperty(id) && BYID[id] && typeof d.w[id] === 'object'){ var b = Number(d.w[id].b), n = Number(d.w[id].n); if (b >= 0 && b <= 5) w[id] = {b: b, n: isFinite(n) ? n : 0}; } }
      S.w = w;
      S.ep = (d.ep && typeof d.ep === 'object') ? d.ep : {};
      S.pista = (d.pista && typeof d.pista === 'object') ? d.pista : {};
      if ([3,4,5].indexOf(Number(d.grade)) >= 0) S.grade = Number(d.grade);
      save(); closeModal(); render(); toast('Progression importée.');
    } catch (e) { toast('Ce fichier n\u2019est pas une progression ¡Palabras!.'); }
    ev.target.value = '';
  };
  r.readAsText(f);
});

function scrollLast(){
  var ls = app.querySelectorAll('.linea'); if (!ls.length) return;
  var el = ls[ls.length - 1], r = el.getBoundingClientRect();
  if (r.bottom > window.innerHeight - 90) window.scrollBy(0, r.bottom - window.innerHeight + 120);
}

/* ---------- Actions ---------- */
var ACT = {
  'go': function(el){ go(el.getAttribute('data-page')); },
  'lugar': function(el){
    var l = LUG[el.getAttribute('data-id')];
    if (!open(l)){ toast(l.nombre + ' ouvre en ' + nivelLabel(l.nivel) + '. Si tu es dans cette classe, change ton niveau en haut.'); return; }
    closeModal();
    if (view.lugar !== l.id){ view.tab = 'episodio'; EP = null; }
    view.lugar = l.id; go('lugar');
  },
  'back-lugar': function(el){ view.lugar = el.getAttribute('data-id'); view.tab = 'jugar'; go('lugar'); },
  'tab': function(el){ view.tab = el.getAttribute('data-tab'); stopAudio(); render(); },
  'toggle': function(el){ var t = $(el.getAttribute('data-target')); if (t) t.classList.toggle('hidden'); },
  'say-intro': function(){ var l = LUG[view.lugar]; speak(l.intro[0], speakerLang(l.guia)); },
  'say-word': function(el){ var w = BYID[el.getAttribute('data-id')]; if (w) speakWord(w); },
  'say-ej': function(el){ var w = BYID[el.getAttribute('data-id')]; if (w) speak(w.ej, wordLang()); },
  'say-vec': function(el){ var v = VEC[el.getAttribute('data-id')]; speak(v.frase, speakerLang(v.id)); },
  'say-line': function(el){ var ln = LUG[view.lugar].episodio.lineas[+el.getAttribute('data-i')]; speak(ln[1], speakerLang(ln[0])); },
  'say-ejp': function(el){ var e = PIS[view.pista].ejemplos[+el.getAttribute('data-i')]; speak(e[0], 'es-ES'); },
  'mot': function(el){ var w = BYID[el.getAttribute('data-id')]; if (w){ toast(w.es + ' : ' + w.fr); speakWord(w); } },
  'ep-next': function(){
    var e = LUG[view.lugar].episodio;
    if (EP.shown < e.lineas.length){ EP.shown++; render(); scrollLast(); var ln = e.lineas[EP.shown - 1]; speak(ln[1], speakerLang(ln[0])); }
  },
  'ep-all': function(){
    var e = LUG[view.lugar].episodio;
    EP.shown = e.lineas.length; render();
    speakQueue(e.lineas.map(function(ln){ return {text: ln[1], lang: speakerLang(ln[0])}; }));
  },
  'ep-restart': function(){ EP = {lugar: view.lugar, shown: 1, mode: 'lectura', qi: 0, score: 0, answered: false, choice: -1}; render(); },
  'ep-quiz': function(){ EP.mode = 'quiz'; EP.qi = 0; EP.score = 0; EP.answered = false; stopAudio(); render(); },
  'ep-resp': function(el){
    if (EP.answered) return;
    var q = LUG[view.lugar].episodio.preguntas[EP.qi];
    EP.choice = +el.getAttribute('data-i'); EP.answered = true;
    if (EP.choice === q[2]) EP.score++;
    render();
  },
  'ep-qnext': function(){
    var l = LUG[view.lugar], e = l.episodio;
    if (EP.qi + 1 < e.preguntas.length){ EP.qi++; EP.answered = false; EP.choice = -1; render(); return; }
    var before = vecinoUnlocked(l.guia);
    if (EP.score >= 2){ S.ep[l.id] = Math.max(S.ep[l.id] || 0, EP.score); save(); }
    EP.unlocked = !before && vecinoUnlocked(l.guia);
    EP.mode = 'fin'; render();
  },
  'open-pista': function(el){
    var p = PIS[el.getAttribute('data-id')];
    if (p.nivel < S.grade){ toast('Cette fiche est pour la ' + nivelLabel(p.nivel) + '.'); return; }
    view.pista = p.id; PX = null; go('pista');
  },
  'pista-mix': function(){ view.pista = 'mix'; PX = null; go('pista'); },
  'px-resp': function(el){
    if (PX.answered) return;
    var e = PX.items[PX.i];
    PX.choice = +el.getAttribute('data-i'); PX.answered = true;
    if (PX.choice === e[2]) PX.score++;
    render(); speak(filled(e, e[1][e[2]]), 'es-ES');
  },
  'px-say': function(){ var e = PX.items[PX.i]; speak(filled(e, e[1][e[2]]), 'es-ES'); },
  'px-next': function(){
    if (PX.i + 1 < PX.items.length){ PX.i++; PX.answered = false; PX.choice = -1; render(); return; }
    PX.done = true;
    if (PX.id !== 'mix'){ S.pista[PX.id] = Math.max(S.pista[PX.id] == null ? 0 : S.pista[PX.id], PX.score); save(); }
    render();
  },
  'px-restart': function(){ startPX(view.pista); render(); },
  'scope': function(el){ view.scope = el.getAttribute('data-scope'); render(); },
  'start': function(el){ startGame(el.getAttribute('data-type'), el.getAttribute('data-scope')); },
  'quit': function(){
    if (G && LUG[G.scope]){ view.lugar = G.scope; view.tab = 'jugar'; go('lugar'); } else go(G && (G.scope === 'repaso' || G.scope === 'nuevos') ? 'repasos' : 'juegos');
  },
  'resp': function(el){
    if (!G || G.answered) return;
    var it = G.items[G.i], j = +el.getAttribute('data-i');
    var ok = it.t === 'genero' ? it.opts[j] === it.w.art : it.opts[j].id === it.w.id;
    finish(ok, j);
  },
  'acento': function(el){
    var inp = $('esc-input'); if (!inp) return;
    var c = el.getAttribute('data-c'), s = inp.selectionStart, e = inp.selectionEnd, v = inp.value;
    if (typeof s !== 'number'){ s = e = v.length; }
    inp.value = v.slice(0, s) + c + v.slice(e); G.input = inp.value;
    inp.focus(); try { inp.setSelectionRange(s + 1, s + 1); } catch (x) {}
  },
  'check-esc': function(){
    var inp = $('esc-input'); if (!inp || G.answered) return;
    G.input = inp.value;
    var w = G.items[G.i].w, r = checkTyped(w, inp.value);
    if (r === null){ toast('Écris ta réponse, ou touche « Je ne sais pas ».'); inp.focus(); return; }
    if (r === 'ok') finish(true, -1);
    else if (r === 'acento') finish(false, -1, true, 'C\u2019est le bon mot, mais vérifie les accents ou le ñ : en espagnol, ils changent le sens (año, ano…).');
    else if (r === 'articulo') finish(false, -1, true, 'Le mot est juste, mais il manque l\u2019article : apprends toujours le nom avec el ou la.');
    else finish(false, -1, false, 'Tu as écrit : ' + inp.value);
  },
  'skip': function(){ if (!G.answered) finish(false, -1); },
  'poner': function(el){ var it = G.items[G.i], j = +el.getAttribute('data-i'); it.built.push(it.bank.splice(j, 1)[0]); render(); },
  'quitar': function(el){ var it = G.items[G.i], j = +el.getAttribute('data-i'); it.bank.push(it.built.splice(j, 1)[0]); render(); },
  'reset-ord': function(){ var it = G.items[G.i]; it.bank = it.bank.concat(it.built); it.built = []; render(); },
  'check-ord': function(){
    var it = G.items[G.i];
    if (it.bank.length) return;
    var ok = it.built.map(function(x){ return x.t; }).join(' ') === it.w.ej;
    finish(ok, -1);
  },
  'next': function(){
    if (G.i + 1 < G.items.length){ G.i++; prepItem(); render(); return; }
    go('resultado');
  },
  'vecino': function(el){ openVecino(el.getAttribute('data-id')); },
  'ajustes': function(){ openAjustes(false); },
  'close-modal': function(){ closeModal(); },
  'modal-bg': function(el, ev){ if (ev.target === el) closeModal(); },
  'cfg': function(el){
    var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
    S.cfg[k] = (k === 'font' || k === 'voz' || k === 'motor') ? v : Number(v);
    save(); applyCfg(); openAjustes(false);
    if (k === 'motor') onlineFailed = false;
    if (k === 'rate' || k === 'voz' || k === 'motor') speak('¡Hola! Bienvenido al barrio.', wordLang());
  },
  'reset-ask': function(){ openAjustes(true); },
  'test-voz': function(){ onlineFailed = false; helpShown = false; speak('¡Hola! Me llamo Mateo y vivo en el barrio.', wordLang()); },
  'voz-help': function(){ openModal('Installer une voix espagnole', voiceHelpHtml().replace(/^<p>.*?<\/p>/, '<p>Sans voix espagnole installée, l\u2019appli utilise une voix en ligne. Pour une voix qui marche aussi sans internet :</p>')); },
  'reset-yes': function(){
    var cfg = S.cfg, g = S.grade; S = defaults(); S.cfg = cfg; S.grade = g; save();
    G = null; EP = null; PX = null; closeModal(); go('inicio'); toast('Progression effacée.');
  },
  'export': function(){ exportProgress(); },
  'import': function(){ $('importFile').click(); }
};
document.addEventListener('click', function(ev){
  var t = ev.target;
  while (t && t !== document){
    if (t.getAttribute && t.getAttribute('data-act')){
      if (t.disabled) return;
      var a = t.getAttribute('data-act');
      if (ACT[a]){ ACT[a](t, ev); }
      return;
    }
    t = t.parentNode;
  }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && $('modal-root').innerHTML) closeModal();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'esc-input'){ ev.preventDefault(); ACT['check-esc'](); }
});
document.addEventListener('input', function(ev){
  if (!ev.target) return;
  if (ev.target.id === 'esc-input' && G) G.input = ev.target.value;
  if (ev.target.id === 'dic-q') fillDic();
});
document.addEventListener('change', function(ev){ if (ev.target && ev.target.id === 'dic-l') fillDic(); });
$('grade').addEventListener('change', function(ev){
  S.grade = Number(ev.target.value); save();
  if (view.page === 'lugar' && !open(LUG[view.lugar])) view.page = 'barrio';
  if (view.page === 'pista' && view.pista !== 'mix' && PIS[view.pista].nivel < S.grade) view.page = 'gramatica';
  if (view.page === 'partida' || view.page === 'resultado'){ view.page = 'juegos'; }
  PX = null; render();
});

render();
})();
</script>
