<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Palabras! · Mi barrio en español · BROT2YOU</title>
<meta name="description" content="Application d'espagnol pour le collège (5e, 4e, 3e) : un quartier à visiter, six voisins du monde hispanique, des épisodes, du vocabulaire, de la grammaire et des jeux.">
<link rel="icon" href="assets/i-fuente.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cielo:#38C5ED; --cielo-claro:#C9EFFB; --sol:#FFCC34; --coral:#FF586C;
  --tinta:#173257; --cobalto:#1F4FA3; --cal:#FFFDF4; --teja:#E0592A;
  --menta:#9BEBCB; --rosa:#FFB3C6; --lila:#CDB8FF; --error:#FFC9D1;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:17px; --ls:0; --ws:0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tinta);font-family:var(--body);font-size:var(--fs);line-height:1.5;letter-spacing:var(--ls);word-spacing:var(--ws);
  background:linear-gradient(180deg,var(--cielo) 0,var(--cielo-claro) 220px,var(--cal) 520px) no-repeat,var(--cal);}
body.f-lexend{--body:'Lexend',system-ui,sans-serif}
body.sz-1{--fs:19px} body.sz-2{--fs:22px}
body.sp-1{--ls:.06em;--ws:.16em} body.sp-1 p,body.sp-1 li{line-height:1.8}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;font-size:1rem;
  border:2.5px solid var(--tinta);border-radius:14px;background:#fff;color:var(--tinta);padding:9px 16px;box-shadow:0 4px 0 var(--tinta);
  transition:transform .12s,box-shadow .12s;text-decoration:none;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--tinta)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:0 4px 0 var(--tinta)}
.btn.primary{background:var(--sol)}
.btn.small{padding:6px 11px;font-size:.88rem;border-width:2px;box-shadow:0 3px 0 var(--tinta);border-radius:11px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn .ico{width:24px;height:24px}
.btn.small .ico{width:20px;height:20px}
.ico{display:inline-block;width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Header */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));
  background:rgba(255,253,244,.95);border-bottom:3px solid var(--tinta);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.top .logo{height:40px;width:auto;flex:none;cursor:pointer;background:none;border:0;padding:0}
.top .logo img{height:40px;width:auto;display:block}
.nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 2px 6px}
.nav::-webkit-scrollbar{display:none}
.navbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:.95rem;background:#fff;border:2px solid var(--tinta);border-radius:12px;padding:5px 11px 5px 6px;box-shadow:0 3px 0 var(--tinta)}
.navbtn .ico{width:26px;height:26px}
.navbtn[aria-current="page"]{background:var(--sol)}
.top-tools{display:flex;gap:8px;align-items:center;flex:none}
.nivel{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;background:#fff;border:2px solid var(--tinta);border-radius:12px;padding:4px 6px 4px 10px;box-shadow:0 3px 0 var(--tinta)}
.nivel select{border:0;background:var(--cielo-claro);border-radius:8px;padding:3px 6px;font-weight:700}
.gear{width:42px;height:42px;padding:0;border:2px solid var(--tinta);border-radius:12px;background:#fff;box-shadow:0 3px 0 var(--tinta);display:inline-flex;align-items:center;justify-content:center}
.gear img{width:32px;height:32px}

/* Landing */
body.is-landing .top{position:absolute;left:0;right:0;background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:flex-end}
body.is-landing .top .logo,body.is-landing .nav{display:none}
.landing{position:relative;min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:24px 22px 5vh;
  background-image:linear-gradient(180deg,transparent 50%,rgba(10,34,70,.42) 100%),url('assets/accueil.webp');background-size:cover;background-position:center 37%;background-color:#4dbdf0}
.landing-logo{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:min(600px,74vw);max-height:30vh;object-fit:contain;filter:drop-shadow(0 6px 9px rgba(19,37,75,.45));pointer-events:none}
.landing-menu{width:min(1000px,100%);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.landing-menu .btn{justify-content:flex-start;text-align:left;min-height:72px;padding:10px 14px;border-width:3px;border-radius:20px;box-shadow:0 5px 0 var(--tinta),0 10px 24px rgba(16,40,77,.35)}
.landing-menu .btn .ico{width:52px;height:52px}
.landing-menu .btn b{display:block;font-size:clamp(1.05rem,1.6vw,1.35rem)}
.landing-menu .btn small{display:block;font-family:var(--body);font-weight:400;font-size:.82rem;opacity:.85}
.landing-menu .btn:nth-child(1){background:var(--sol)} .landing-menu .btn:nth-child(2){background:var(--rosa)} .landing-menu .btn:nth-child(3){background:var(--lila)}
.landing-menu .btn:nth-child(4){background:var(--menta)} .landing-menu .btn:nth-child(5){background:#A9E8FA} .landing-menu .btn:nth-child(6){background:#FFC98A}
.badge{display:inline-block;min-width:24px;padding:0 7px;border-radius:12px;background:var(--coral);color:#fff;font-family:var(--display);font-weight:700;font-size:.8rem;text-align:center;line-height:22px;margin-left:4px}

/* Pages */
main{display:block}
.page{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin:6px 0 22px}
.lede{margin:0;max-width:60ch;font-size:1.02rem}
.panel{background:#fff;border:2.5px solid var(--tinta);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--tinta);margin-bottom:22px}
h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0 0 12px}
h2{font-size:1.5rem} h3{font-size:1.2rem}
.muted{opacity:.78}

/* Azulejo plaque: the signature element */
.plaque{display:inline-block;margin:0;font-family:var(--display);font-weight:700;color:var(--cobalto);font-size:1.6rem;line-height:1.15;padding:.32em .9em .36em;
  background:radial-gradient(circle at 9px 9px,var(--cobalto) 3.5px,transparent 4.5px),radial-gradient(circle at calc(100% - 9px) 9px,var(--cobalto) 3.5px,transparent 4.5px),
  radial-gradient(circle at 9px calc(100% - 9px),var(--cobalto) 3.5px,transparent 4.5px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),var(--cobalto) 3.5px,transparent 4.5px),#fff;
  border:3px solid var(--cobalto);border-radius:8px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--cobalto),0 4px 0 var(--tinta)}
.plaque.big{font-size:clamp(1.7rem,4vw,2.4rem)}
.plaque.sm{font-size:1rem;padding:.22em .7em;background:#fff;border-width:2.5px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--cobalto)}

/* Neighbours */
.vecinos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:28px}
.vecino{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--tinta);border-radius:18px;padding:10px 6px 12px;box-shadow:0 4px 0 var(--tinta);text-align:center}
.vecino img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--sol);background:var(--cielo-claro);object-position:center top}
.vecino b{font-family:var(--display);font-size:1.05rem}
.vecino small{font-size:.8rem;line-height:1.25}
.vecino .lock{font-size:.75rem;opacity:.7}

/* Streets and facades */
.calle{margin-bottom:34px}
.street-sign{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.street-sign .nivel-tag{font-family:var(--display);font-weight:700;background:var(--tinta);color:#fff;border-radius:10px;padding:3px 10px;font-size:.95rem}
.fachadas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px 22px;padding:0 6px 20px;
  background:linear-gradient(180deg,transparent calc(100% - 20px),#E8D9B5 calc(100% - 20px)) no-repeat;border-radius:0 0 12px 12px}
.fachada{position:relative;display:flex;flex-direction:column;background:none;border:0;padding:0;text-align:center;color:var(--tinta);transition:transform .15s}
.fachada:hover{transform:translateY(-3px)}
.tejado{display:block;align-self:stretch;height:28px;margin:0 -8px;border:2.5px solid var(--tinta);border-radius:8px 8px 3px 3px;
  background:repeating-linear-gradient(90deg,#E86A3A 0 16px,#C8491F 16px 19px)}
.muro{align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;background:var(--cal);border:2.5px solid var(--tinta);border-top:0;border-radius:0 0 14px 14px;padding:16px 12px 14px;box-shadow:0 5px 0 var(--tinta)}
.ventana{display:block;width:96px;height:100px;border:3px solid var(--tinta);border-radius:48px 48px 10px 10px;overflow:hidden;background:#fff}
.ventana img{width:100%;height:100%;object-fit:contain;padding:8px 6px 4px;display:block}
.fachada .plaque{font-size:1.02rem}
.fachada .tema{font-size:.86rem;line-height:1.3;min-height:2.6em}
.fachada .guia{position:absolute;top:30px;right:-6px;width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--tinta);background:var(--cielo-claro);object-position:center top}
.mini-bar{display:block;width:100%;height:9px;border:2px solid var(--tinta);border-radius:6px;background:#fff;overflow:hidden}
.mini-bar span{display:block;height:100%;background:var(--cielo)}
.estado{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:.78rem;gap:6px}
.sello{font-family:var(--display);font-weight:700;font-size:.75rem;border-radius:8px;padding:1px 7px;border:2px solid var(--tinta)}
.sello.oro{background:var(--sol)} .sello.plata{background:#E3E8EF} .sello.visto{background:var(--cielo-claro)} .sello.nuevo{background:#fff}
.fachada.locked .muro,.fachada.locked .tejado{filter:grayscale(1) opacity(.55)}
.fachada.locked .candado{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--tinta);color:#fff;font-family:var(--display);font-weight:600;border-radius:12px;padding:6px 12px;font-size:.9rem;white-space:nowrap}

/* Place page */
.volver{margin-bottom:16px}
.lugar-hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-bottom:22px}
.guia-big{width:140px;height:140px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 0 0 3px var(--tinta),0 8px 0 var(--tinta);background:var(--cielo-claro);object-position:center top}
.lugar-hero .sub{margin:10px 0 12px;font-weight:700}
.bubble{position:relative;background:#fff;border:2.5px solid var(--tinta);border-radius:18px;padding:12px 16px;max-width:640px}
.bubble p{margin:0 0 6px}
.bubble .fr{font-style:italic;opacity:.85}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tab{font-family:var(--display);font-weight:600;background:#fff;border:2.5px solid var(--tinta);border-radius:14px 14px 6px 6px;padding:8px 14px;box-shadow:0 3px 0 var(--tinta);display:inline-flex;align-items:center;gap:7px}
.tab[aria-selected="true"]{background:var(--sol)}
.tab .ico{width:24px;height:24px}

/* Episode */
.ep-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.lineas{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.linea{display:flex;align-items:flex-end;gap:10px;animation:pop .25s ease-out}
.linea.der{flex-direction:row-reverse}
.linea .who{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;width:68px;text-align:center;font-family:var(--display);font-weight:600;font-size:.8rem}
.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2.5px var(--tinta);background:var(--cielo-claro);display:inline-flex;align-items:center;justify-content:center;font-size:32px;object-position:center top}
.burbuja{position:relative;background:#fff;border:2.5px solid var(--tinta);border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:680px}
.linea.der .burbuja{border-radius:18px 18px 4px 18px;background:#FFF6D6}
.burbuja .es{font-size:1.12rem;margin:0 0 6px}
.burbuja .fr{margin:6px 0 0;font-style:italic;opacity:.85}
.mot{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:2.5px dotted var(--cobalto);cursor:pointer}
.mot:hover{background:var(--cielo-claro)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Words */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.word{background:#fff;border:2.5px solid var(--tinta);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--tinta)}
.word .top-line{display:flex;align-items:center;gap:10px}
.word .emo{font-size:2rem;line-height:1}
.word strong{font-family:var(--display);font-size:1.2rem;font-weight:600;line-height:1.2}
.word .fr{font-size:.95rem}
.word .ej{font-size:.9rem;border-top:2px dashed #E3D9BF;padding-top:6px;margin-top:4px}
.word .ej i{display:block;opacity:.75;font-size:.85rem}
.pips{display:inline-flex;gap:3px;margin-left:auto}
.pips span{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tinta);background:#fff}
.pips span.on{background:var(--cielo)}
.pips.done span.on{background:var(--sol)}

/* Games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:#fff;border:2.5px solid var(--tinta);border-radius:18px;padding:14px;box-shadow:0 5px 0 var(--tinta);color:var(--tinta)}
.game .ico{width:60px;height:60px}
.game b{font-family:var(--display);font-size:1.15rem}
.game small{font-size:.88rem}
.game:nth-child(4n+1){background:#FFF3C4}.game:nth-child(4n+2){background:#FFE0E8}.game:nth-child(4n+3){background:#ECE3FF}.game:nth-child(4n){background:#DDF8EE}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{font-family:var(--display);font-weight:600;border:2px solid var(--tinta);border-radius:20px;background:#fff;padding:5px 12px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--tinta);color:#fff}
.partida{max-width:760px;margin:0 auto}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.bar{height:14px;border:2.5px solid var(--tinta);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:22px}
.bar span{display:block;height:100%;background:var(--cielo);transition:width .25s}
.prompt{text-align:center;margin:8px 0 22px}
.prompt .emo{font-size:3.4rem;line-height:1.1;display:block}
.prompt .big{font-family:var(--display);font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:600;line-height:1.2;display:block}
.prompt .hint{font-size:.95rem}
.prompt .listen{width:96px;height:96px;border-radius:50%;padding:0}
.prompt .listen img{width:62px;height:62px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:64px;font-family:var(--display);font-weight:600;font-size:1.12rem;background:#fff;border:2.5px solid var(--tinta);border-radius:16px;box-shadow:0 4px 0 var(--tinta);padding:10px}
.opt.ok{background:var(--menta)} .opt.ko{background:var(--error)}
.opt[disabled]{cursor:default}
.feedback{margin-top:20px;border:2.5px solid var(--tinta);border-radius:16px;padding:14px 16px;background:#fff}
.feedback.ok{background:#E3FAF0} .feedback.ko{background:#FFEFF2} .feedback.casi{background:#FFF7D9}
.feedback b.title{font-family:var(--display);font-size:1.15rem;display:block;margin-bottom:4px}
.typing{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.typing input{font-family:var(--display);font-size:1.5rem;font-weight:600;text-align:center;border:2.5px solid var(--tinta);border-radius:14px;padding:12px;background:#fff}
.acentos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.acentos button{min-width:44px;height:44px;font-family:var(--display);font-weight:700;font-size:1.15rem;border:2px solid var(--tinta);border-radius:10px;background:var(--cielo-claro)}
.zona{min-height:64px;border:2.5px dashed var(--tinta);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#fff;margin-bottom:14px}
.banco{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.token{font-family:var(--display);font-weight:600;font-size:1.1rem;border:2px solid var(--tinta);border-radius:12px;background:#FFF3C4;padding:7px 12px;box-shadow:0 3px 0 var(--tinta)}
.zona .token{background:var(--cielo-claro)}
.resumen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.resumen li{border:2px solid var(--tinta);border-radius:12px;padding:6px 10px;background:#fff}
.resumen li.ok{background:#E3FAF0} .resumen li.ko{background:#FFEFF2}

/* Reviews (Leitner boxes) */
.cajas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0}
.caja{border:2.5px solid var(--tinta);border-radius:14px;padding:10px 6px;text-align:center;background:#fff}
.caja b{display:block;font-family:var(--display);font-size:1.6rem}
.caja small{font-size:.78rem;line-height:1.2;display:block}
.caja:nth-child(1){background:#F2F2F2}.caja:nth-child(2){background:#FFE0E8}.caja:nth-child(3){background:#FFF3C4}.caja:nth-child(4){background:#DDF3FF}.caja:nth-child(5){background:#DDF8EE}.caja:nth-child(6){background:var(--sol)}

/* Grammar */
.pistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pista-card{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2.5px solid var(--tinta);border-radius:16px;padding:12px;box-shadow:0 4px 0 var(--tinta);color:var(--tinta)}
.pista-card .ico{width:48px;height:48px}
.pista-card b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.25}
.pista-card small{display:block;font-size:.85rem}
.pista-card.locked{opacity:.5}
.explica p{max-width:70ch}
.tabla-wrap{overflow-x:auto;margin:14px 0}
table.conj{border-collapse:separate;border-spacing:0;border:2.5px solid var(--cobalto);border-radius:12px;overflow:hidden;min-width:280px;background:#fff}
table.conj th,table.conj td{padding:7px 14px;border-bottom:1.5px solid #CFDDF3;text-align:left}
table.conj tr:first-child th{background:var(--cobalto);color:#fff;font-family:var(--display);font-weight:600}
table.conj td:first-child{font-weight:700;color:var(--cobalto)}
table.conj b{color:var(--coral)}
table.conj tr:last-child td{border-bottom:0}
.ejemplos{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:8px}
.ejemplos li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--coral);text-align:center;font-weight:700;color:var(--coral)}
.frase{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:500;text-align:center;margin:10px 0 22px;line-height:1.35}

/* Dictionary */
.dic-tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.dic-tools input,.dic-tools select{border:2.5px solid var(--tinta);border-radius:12px;padding:9px 12px;background:#fff;min-width:0}
.dic-tools input{flex:1 1 240px}
.dic-list{display:flex;flex-direction:column;gap:6px}
.dic-row{display:grid;grid-template-columns:42px minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--tinta);border-radius:12px;padding:6px 10px}
.dic-row .emo{font-size:1.6rem;text-align:center}
.dic-row strong{font-family:var(--display);font-weight:600}
.dic-row small{font-size:.78rem;white-space:nowrap}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:2.5px solid var(--tinta);border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 0 var(--tinta)}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.stat small{font-size:.85rem}
.cromos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cromo{display:flex;flex-direction:column;align-items:center;gap:6px;border:2.5px solid var(--tinta);border-radius:14px;padding:10px 6px;background:#fff;text-align:center;color:var(--tinta)}
.cromo img{width:68px;height:68px;object-fit:contain}
.cromo b{font-family:var(--display);font-size:.92rem;line-height:1.2}
.cromo.nuevo img{filter:grayscale(1) opacity(.45)}
.cromo.oro{background:#FFF1BF;box-shadow:0 0 0 3px var(--sol) inset}
.cromo.plata{background:#F1F4F8}

/* Modal and toast */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(23,50,87,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--cal);border:3px solid var(--tinta);border-radius:22px;box-shadow:0 8px 0 var(--tinta);max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cfg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:2px dashed #E3D9BF}
.cfg-row > span{flex:1 1 180px;font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:2px solid var(--tinta);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-family:var(--display);font-weight:600}
.seg button+button{border-left:2px solid var(--tinta)}
.seg button[aria-pressed="true"]{background:var(--sol)}
.vec-modal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.vec-modal img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--sol);object-position:center top}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:80;background:var(--tinta);color:#fff;font-family:var(--display);font-weight:600;border-radius:14px;padding:10px 18px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:10px 16px 30px;font-size:.85rem;opacity:.8}
body.is-landing footer{display:none}

@media (max-width:900px){
  .vecinos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:650px){
  .top{gap:8px;flex-wrap:wrap}
  .top .logo img{height:32px}
  .nav{order:3;flex-basis:100%}
  .top-tools{margin-left:auto}
  .landing{background-image:linear-gradient(180deg,transparent 52%,rgba(10,34,70,.45) 100%),url('assets/accueil-mobile.webp');background-size:100% 100%,100% auto;background-repeat:no-repeat;background-position:center top;padding:14px 12px 22px}
  .landing-logo{top:7%;width:min(88vw,400px);max-height:22vh}
  .landing-menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .landing-menu .btn{min-height:60px;padding:8px 9px;border-radius:15px;gap:7px}
  .landing-menu .btn .ico{width:36px;height:36px}
  .landing-menu .btn small{display:none}
  .page{padding:16px 12px 50px}
  .fachadas{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .ventana{width:76px;height:80px}
  .fachada .guia{width:40px;height:40px;top:26px}
  .lugar-hero{grid-template-columns:1fr;justify-items:start}
  .guia-big{width:96px;height:96px}
  .opts{grid-template-columns:1fr}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .tab{flex:none}
  .cajas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dic-row{grid-template-columns:34px minmax(0,1fr) auto;}
  .dic-row .fr-col{grid-column:2/3;grid-row:2}
  .dic-row small{display:none}
  .vec-modal{grid-template-columns:1fr}
  .linea .who{width:52px}
  .avatar{width:46px;height:46px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .btn:hover,.fachada:hover{transform:none}
}

"],["diego","¡Yo tengo un perro! Se llama Rayo.","Moi, j'ai un chien ! Il s'appelle Rayo."]],"preguntas":[["Avec qui vit Valentina ?",["Avec ses parents, son frère et sa grand-mère","Seule avec sa mère","Avec ses cousins"],0],["Quel âge a Andrés ?",["6 ans","8 ans","12 ans"],1],["Où dort Tako, le chat ?",["Dans le salon","Dans la cuisine","Dans la chambre de Valentina"],2]]}},{"id":"instituto","nombre":"El Instituto","icono":"i-libros","nivel":5,"guia":"mateo","tema":"Le collège","pista":"p-ar","intro":["Este es mi instituto. ¡Vamos a clase!","Voici mon collège. Allons en cours !"],"cultura":"En Espagne, on va **al colegio** jusqu'à 12 ans, puis **al instituto** (la ESO, de 12 à 16 ans). Dans beaucoup de régions, les cours finissent vers 14 h 30 et l'après-midi est libre. Les notes vont de 0 à 10 : avec **5**, on est **aprobado** (reçu).","palabras":[["el instituto","le collège, le lycée","🏫","Voy al instituto en autobús.","Je vais au collège en bus."],["la clase","la classe, le cours","📋","La clase empieza a las ocho y media.","Le cours commence à huit heures et demie."],["el profesor / la profesora","le professeur, la professeure","🧑‍🏫","La profesora explica la lección.","La prof explique la leçon."],["el alumno / la alumna","l'élève","🧑‍🎓","Somos veinticinco alumnos.","Nous sommes vingt-cinq élèves."],["la asignatura","la matière","📚","Mi asignatura favorita es la historia.","Ma matière préférée est l'histoire."],["las matemáticas","les mathématiques","➗","Las matemáticas son difíciles.","Les maths sont difficiles."],["el inglés","l'anglais","🗽","Estudio inglés y francés.","J'étudie l'anglais et le français."],["la historia","l'histoire","🏺","Me gusta mucho la historia.","J'aime beaucoup l'histoire."],["la educación física","l'EPS","🏃","Tenemos educación física el lunes.","Nous avons EPS le lundi."],["el recreo","la récréation","🔔","En el recreo hablo con mis amigos.","À la récré, je parle avec mes amis."],["el horario","l'emploi du temps","🗓️","Mi horario es muy largo.","Mon emploi du temps est très long."],["el libro","le livre","📖","Abre el libro, por favor.","Ouvre le livre, s'il te plaît."],["el cuaderno","le cahier","📓","Mi cuaderno está en la mochila.","Mon cahier est dans le sac."],["el bolígrafo","le stylo","🖊️","¿Tienes un bolígrafo?","Tu as un stylo ?"],["la mochila","le sac à dos","🎒","Mi mochila pesa mucho.","Mon sac pèse lourd."],["los deberes","les devoirs","📝","Hago los deberes por la tarde.","Je fais mes devoirs l'après-midi."],["estudiar","étudier, travailler","🤓","Estudio en la biblioteca.","J'étudie à la bibliothèque."],["escuchar","écouter","👂","Escucho a la profesora.","J'écoute la prof."],["hablar","parler","🗣️","Hablo español en clase.","Je parle espagnol en classe."],["la biblioteca","la bibliothèque, le CDI","🏛️","La biblioteca está cerrada.","La bibliothèque est fermée."]],"episodio":{"titulo":"¡Mi cuaderno!","lineas":[["pablo","Mateo, ¿qué clase tenemos ahora?","Mateo, on a quel cours maintenant ?"],["mateo","Ahora tenemos matemáticas con la profesora Ruiz.","Maintenant, on a maths avec Mme Ruiz."],["pablo","¡Uf! Las matemáticas son difíciles para mí.","Pff ! Les maths, c'est difficile pour moi."],["mateo","Para mí no. Pero mi asignatura favorita es la historia.","Pas pour moi. Mais ma matière préférée, c'est l'histoire."],["pablo","A mí me gusta el inglés. Escucho canciones en inglés todos los días.","Moi, j'aime l'anglais. J'écoute des chansons en anglais tous les jours."],["mateo","¿Tienes los deberes de historia?","Tu as les devoirs d'histoire ?"],["pablo","Sí, están en mi mochila… ¡Ay, no! ¡Mi cuaderno está en casa!","Oui, ils sont dans mon sac… Oh non ! Mon cahier est à la maison !"],["mateo","Tranquilo. En el recreo estudiamos juntos.","T'inquiète. À la récré, on travaille ensemble."]],"preguntas":[["Quel cours ont-ils maintenant ?",["Histoire","Mathématiques","Anglais"],1],["Quelle est la matière préférée de Mateo ?",["Les maths","L'histoire","L'anglais"],1],["Quel est le problème de Pablo ?",["Il a oublié son cahier à la maison","Il est en retard","Il a perdu son stylo"],0]]}},{"id":"mercado","nombre":"El Mercado","icono":"i-naranjas","nivel":5,"guia":"valentina","tema":"La nourriture et les courses","pista":"p-gustar","intro":["¡Vamos al mercado! Doña Carmen tiene la mejor fruta del barrio.","Allons au marché ! Madame Carmen a les meilleurs fruits du quartier."],"cultura":"En Espagne, on mange plus tard qu'en France : **la comida** vers 14 h et **la cena** vers 21 h ou 22 h. Les marchés couverts, comme **la Boqueria** à Barcelone, sont des lieux de vie. Au Mexique, on fait ses courses au **tianguis**, un marché en plein air dont la tradition remonte aux Aztèques.","palabras":[["el mercado","le marché","🧺","Voy al mercado con mi madre.","Je vais au marché avec ma mère."],["la fruta","les fruits","🍓","La fruta está muy fresca.","Les fruits sont très frais."],["la manzana","la pomme","🍎","Como una manzana en el recreo.","Je mange une pomme à la récré."],["la naranja","l'orange","🍊","Las naranjas de Valencia son famosas.","Les oranges de Valence sont célèbres."],["el plátano","la banane","🍌","Me gusta el plátano.","J'aime la banane."],["el tomate","la tomate","🍅","Compramos un kilo de tomates.","Nous achetons un kilo de tomates."],["la patata / la papa","la pomme de terre (Espagne / Amérique)","🥔","Mi abuela prepara patatas.","Ma grand-mère prépare des pommes de terre."],["el pan","le pain","🍞","Compro pan en la panadería.","J'achète du pain à la boulangerie."],["el queso","le fromage","🧀","Me encanta el queso manchego.","J'adore le fromage manchego."],["el pescado","le poisson (à manger)","🐟","El pescado está fresco.","Le poisson est frais."],["la carne","la viande","🥩","No como carne.","Je ne mange pas de viande."],["el pollo","le poulet","🍗","Hoy comemos pollo con arroz.","Aujourd'hui, nous mangeons du poulet avec du riz."],["el agua","l'eau","💧","Bebo mucha agua.","Je bois beaucoup d'eau.",{"nog":1}],["la leche","le lait","🥛","Desayuno leche con cereales.","Je prends du lait avec des céréales au petit-déjeuner."],["el chocolate","le chocolat","🍫","Me encanta el chocolate caliente.","J'adore le chocolat chaud."],["el desayuno","le petit-déjeuner","🥐","El desayuno es a las siete.","Le petit-déjeuner est à sept heures."],["la comida","le repas, le déjeuner","🍽️","La comida es a las dos.","Le déjeuner est à deux heures."],["la cena","le dîner","🌮","La cena es a las nueve.","Le dîner est à neuf heures."],["comprar","acheter","🛒","Voy a comprar fruta.","Je vais acheter des fruits."],["¿Cuánto cuesta?","Combien ça coûte ?","💰","¿Cuánto cuesta un kilo de tomates?","Combien coûte un kilo de tomates ?"],["el kilo","le kilo","⚖️","Un kilo de naranjas, por favor.","Un kilo d'oranges, s'il vous plaît."]],"episodio":{"titulo":"En el puesto de doña Carmen","lineas":[["valentina","Buenos días, doña Carmen.","Bonjour, madame Carmen."],["vendedora","Buenos días, Valentina. ¿Qué quieres hoy?","Bonjour, Valentina. Qu'est-ce que tu veux aujourd'hui ?"],["valentina","Un kilo de tomates y dos aguacates, por favor.","Un kilo de tomates et deux avocats, s'il vous plaît."],["vendedora","Aquí tienes. ¿Algo más?","Voilà. Autre chose ?"],["valentina","Sí. ¿Cuánto cuestan las naranjas?","Oui. Combien coûtent les oranges ?"],["vendedora","Dos euros el kilo. Son de Valencia, ¡están muy dulces!","Deux euros le kilo. Elles viennent de Valence, elles sont très sucrées !"],["valentina","¡Me encantan las naranjas! Un kilo, por favor.","J'adore les oranges ! Un kilo, s'il vous plaît."],["vendedora","Son seis euros en total. ¡Gracias, guapa!","Ça fait six euros en tout. Merci, ma belle !"]],"preguntas":[["Que demande Valentina en premier ?",["Des tomates et des avocats","Du pain et du fromage","Du poisson"],0],["Combien coûtent les oranges ?",["1 € le kilo","2 € le kilo","6 € le kilo"],1],["Combien paie Valentina en tout ?",["2 €","4 €","6 €"],2]]}},{"id":"parque","nombre":"El Parque","icono":"i-banco","nivel":4,"guia":"diego","tema":"Les loisirs et le sport","pista":"p-diptongo","intro":["¿Juegas al fútbol? En el parque siempre hay un partido.","Tu joues au foot ? Au parc, il y a toujours un match."],"cultura":"Le football est une passion en Espagne. À Séville, deux clubs rivaux se partagent la ville, **el Betis** et **el Sevilla** : leur match s'appelle **el derbi sevillano**. Le basket (**el baloncesto**) est l'autre grand sport du pays, et les parcs se remplissent le soir, quand il fait moins chaud.","palabras":[["el parque","le parc","🌳","Quedamos en el parque.","On se retrouve au parc."],["el fútbol","le football","⚽","Juego al fútbol los sábados.","Je joue au foot le samedi."],["el baloncesto","le basket","🏀","Mateo prefiere el baloncesto.","Mateo préfère le basket."],["la natación","la natation","🏊","Hago natación dos veces por semana.","Je fais de la natation deux fois par semaine."],["montar en bici","faire du vélo","🚲","Monto en bici en el parque.","Je fais du vélo au parc."],["correr","courir","🏃","Corro con mi padre los domingos.","Je cours avec mon père le dimanche."],["patinar","faire du roller, patiner","🛼","Mi hermana patina muy bien.","Ma sœur fait très bien du roller."],["jugar","jouer","🎮","Juego a los videojuegos con mi primo.","Je joue aux jeux vidéo avec mon cousin."],["el partido","le match","🏟️","El partido empieza a las seis.","Le match commence à six heures."],["el equipo","l'équipe","👕","Mi equipo favorito es el Betis.","Mon équipe préférée est le Betis."],["el balón","le ballon","🏐","¿Dónde está el balón?","Où est le ballon ?"],["ganar","gagner","🏆","Mi equipo gana casi siempre.","Mon équipe gagne presque toujours."],["perder","perdre","😞","Hoy perdemos tres a uno.","Aujourd'hui, nous perdons trois à un."],["quedar","se donner rendez-vous","📲","¿Quedamos a las cinco?","On se retrouve à cinq heures ?"],["el tiempo libre","le temps libre","⏱️","En mi tiempo libre, leo cómics.","Pendant mon temps libre, je lis des BD."],["leer","lire","📚","Me gusta leer en el parque.","J'aime lire au parc."],["dibujar","dessiner","🎨","Dibujo personajes de manga.","Je dessine des personnages de manga."],["bailar","danser","💃","Mi hermana baila flamenco.","Ma sœur danse le flamenco."],["escuchar música","écouter de la musique","🎧","Escucho música en el autobús.","J'écoute de la musique dans le bus."],["me encanta","j'adore","😍","Me encanta bailar.","J'adore danser."],["prefiero","je préfère","🤔","Prefiero el baloncesto.","Je préfère le basket."],["odio","je déteste","😤","Odio perder.","Je déteste perdre."]],"episodio":{"titulo":"Betis contra Real Madrid","lineas":[["diego","¡Mateo! ¿Quedamos en el parque esta tarde?","Mateo ! On se retrouve au parc cet après-midi ?"],["mateo","Vale. ¿Jugamos al fútbol?","D'accord. On joue au foot ?"],["diego","¡Claro! Juego al fútbol todos los días. Me encanta.","Bien sûr ! Je joue au foot tous les jours. J'adore."],["mateo","Yo prefiero el baloncesto, pero puedo jugar al fútbol.","Moi, je préfère le basket, mais je peux jouer au foot."],["diego","Y después, ¿quieres ver el partido del Betis en mi casa?","Et après, tu veux voir le match du Betis chez moi ?"],["mateo","¡Uf! Yo soy del Real Madrid…","Pff ! Moi, je suis pour le Real Madrid…"],["diego","No pasa nada. ¡Hoy gana el Betis!","Pas grave. Aujourd'hui, c'est le Betis qui gagne !"],["mateo","Ya veremos. ¡Hasta las cinco!","On verra bien. À cinq heures !"]],"preguntas":[["Que fait Diego tous les jours ?",["Du basket","Du foot","Du vélo"],1],["Quel est le sport préféré de Mateo ?",["Le foot","La natation","Le basket"],2],["Quelle équipe soutient Mateo ?",["Le Betis","Le Real Madrid","Le Sevilla"],1]]}},{"id":"terraza","nombre":"La Terraza","icono":"i-terraza","nivel":4,"guia":"mateo","tema":"La journée et l'heure","pista":"p-pronominal","intro":["En la terraza hablamos de todo: del día, de la hora, de la vida.","Sur la terrasse, on parle de tout : de la journée, de l'heure, de la vie."],"cultura":"En Espagne, la journée est décalée : on prend le goûter (**la merienda**) vers 18 h et on dîne tard. L'été, les terrasses restent pleines jusqu'à minuit. Mais la **siesta** tous les jours est surtout un cliché : la plupart des Espagnols n'ont pas le temps d'en faire une !","palabras":[["despertarse","se réveiller","⏰","Me despierto a las siete.","Je me réveille à sept heures."],["levantarse","se lever","🛏️","Me levanto temprano.","Je me lève tôt."],["ducharse","se doucher","🚿","Me ducho por la mañana.","Je me douche le matin."],["vestirse","s'habiller","🧦","Me visto muy rápido.","Je m'habille très vite."],["desayunar","prendre le petit-déjeuner","🥣","Desayuno cereales con leche.","Je prends des céréales au lait au petit-déjeuner."],["comer","manger, déjeuner","🍝","Como a las dos con mi familia.","Je déjeune à deux heures avec ma famille."],["merendar","prendre le goûter","🥪","Meriendo a las seis.","Je goûte à six heures."],["cenar","dîner","🌙","Cenamos a las nueve y media.","Nous dînons à neuf heures et demie."],["acostarse","se coucher","😴","Me acuesto a las diez.","Je me couche à dix heures."],["temprano","tôt","🐓","Mi padre se levanta temprano.","Mon père se lève tôt."],["tarde","tard","🦉","El sábado me acuesto tarde.","Le samedi, je me couche tard."],["por la mañana","le matin","🌅","Por la mañana voy al instituto.","Le matin, je vais au collège."],["por la tarde","l'après-midi","🌆","Por la tarde hago los deberes.","L'après-midi, je fais mes devoirs."],["por la noche","le soir, la nuit","🌃","Por la noche leo en la cama.","Le soir, je lis au lit."],["siempre","toujours","🔁","Siempre desayuno en casa.","Je prends toujours mon petit-déjeuner à la maison."],["a veces","parfois","🎲","A veces como en la terraza.","Parfois, je mange sur la terrasse."],["nunca","jamais","🚫","Nunca me levanto tarde.","Je ne me lève jamais tard."],["¿Qué hora es?","Quelle heure est-il ?","🕐","Perdona, ¿qué hora es?","Pardon, quelle heure est-il ?"],["son las dos","il est deux heures","🕑","Son las dos y media.","Il est deux heures et demie."],["y media","et demie","🕧","Es la una y media.","Il est une heure et demie."],["menos cuarto","moins le quart","🕤","Son las tres menos cuarto.","Il est trois heures moins le quart."],["el fin de semana","le week-end","🎉","El fin de semana duermo mucho.","Le week-end, je dors beaucoup."],["la terraza","la terrasse","☕","Merendamos en la terraza.","Nous goûtons sur la terrasse."]],"episodio":{"titulo":"Mateo está cansado","lineas":[["lucia","Mateo, ¡qué cara de cansado tienes!","Mateo, tu as l'air vraiment fatigué !"],["mateo","Sí… Me levanto a las siete y me acuesto muy tarde.","Oui… Je me lève à sept heures et je me couche très tard."],["lucia","¿A qué hora te acuestas?","À quelle heure tu te couches ?"],["mateo","A las once y media. Ceno a las diez, como mi familia.","À onze heures et demie. Je dîne à dix heures, comme ma famille."],["lucia","¡A las diez! En Buenos Aires también cenamos muy tarde.","À dix heures ! À Buenos Aires aussi, on dîne très tard."],["mateo","Y por la mañana nunca desayuno. No tengo tiempo.","Et le matin, je ne prends jamais de petit-déjeuner. Je n'ai pas le temps."],["lucia","¡Mal! Mañana desayunamos juntos aquí, en la terraza. A las ocho menos cuarto.","Pas bien ! Demain, on prend le petit-déjeuner ensemble ici, sur la terrasse. À huit heures moins le quart."],["mateo","Vale, pero ¡tú me despiertas!","D'accord, mais c'est toi qui me réveilles !"]],"preguntas":[["À quelle heure se couche Mateo ?",["22 h","23 h 30","Minuit"],1],["Que ne fait jamais Mateo ?",["Dîner","Prendre son petit-déjeuner","Se doucher"],1],["Quel rendez-vous fixent-ils ?",["Demain 7 h 45 sur la terrasse","Demain 8 h 15 au collège","Ce soir 22 h chez Lucía"],0]]}},{"id":"estacion","nombre":"La Estación","icono":"i-cartel","nivel":4,"guia":"lucia","tema":"Les voyages et les transports","pista":"p-ira","intro":["¡Che, bienvenido a la estación! ¿Adónde vas a viajar?","Hé, bienvenue à la gare ! Où vas-tu voyager ?"],"cultura":"L'Espagne possède l'un des plus grands réseaux de trains à grande vitesse au monde : **el AVE** relie Madrid à Séville en 2 h 30 environ. En Argentine, les distances sont immenses : pour aller de Buenos Aires à la Patagonie, on prend souvent **el micro** (le car) de nuit ou l'avion.","palabras":[["la estación","la gare","🚉","La estación está cerca de la plaza.","La gare est près de la place."],["el tren","le train","🚆","Tomo el tren a Barcelona.","Je prends le train pour Barcelone."],["el autobús","le bus","🚌","Voy al instituto en autobús.","Je vais au collège en bus."],["el avión","l'avion","✈️","Viajo en avión a Buenos Aires.","Je vais à Buenos Aires en avion."],["el metro","le métro","🚇","Tomo el metro para ir al centro.","Je prends le métro pour aller au centre."],["el coche / el auto","la voiture (Espagne / Amérique)","🚗","Mi madre va al trabajo en coche.","Ma mère va au travail en voiture."],["a pie","à pied","🚶‍♀️","Voy al parque a pie.","Je vais au parc à pied."],["el billete / el boleto","le billet (Espagne / Amérique)","🎫","No encuentro mi billete.","Je ne trouve pas mon billet."],["la maleta","la valise","🧳","Mi maleta es muy pesada.","Ma valise est très lourde."],["el viaje","le voyage","🧭","¡Buen viaje!","Bon voyage !"],["viajar","voyager","🌎","Voy a viajar a Argentina.","Je vais voyager en Argentine."],["salir","partir, sortir","🚪","El tren sale a las diez.","Le train part à dix heures."],["llegar","arriver","🏁","Llegamos a Córdoba por la noche.","Nous arrivons à Cordoue le soir."],["el andén","le quai","🛤️","El tren está en el andén tres.","Le train est quai trois."],["el mapa","la carte, le plan","🗺️","Mira el mapa del metro.","Regarde le plan du métro."],["el pasaporte","le passeport","🛂","Necesito mi pasaporte.","J'ai besoin de mon passeport."],["las vacaciones","les vacances","🌴","En vacaciones voy a casa de mis abuelos.","En vacances, je vais chez mes grands-parents."],["la playa","la plage","🏖️","Vamos a la playa en agosto.","Nous allons à la plage en août."],["la montaña","la montagne","⛰️","Vamos a la montaña en invierno.","Nous allons à la montagne en hiver."],["el hotel","l'hôtel","🏨","El hotel está cerca de la playa.","L'hôtel est près de la plage."],["reservar","réserver","💻","Mis padres reservan el hotel.","Mes parents réservent l'hôtel."],["la frontera","la frontière","🚧","Pasamos la frontera con Francia.","Nous passons la frontière avec la France."]],"episodio":{"titulo":"El billete perdido","lineas":[["lucia","¡Sofía! ¿Adónde vas con esa maleta?","Sofía ! Où vas-tu avec cette valise ?"],["sofia","Voy a viajar a Barcelona con mi familia.","Je vais voyager à Barcelone avec ma famille."],["lucia","¡Qué suerte! ¿Vas a ir en avión?","Quelle chance ! Tu vas y aller en avion ?"],["sofia","No, vamos a tomar el tren. Es más ecológico.","Non, nous allons prendre le train. C'est plus écologique."],["lucia","¿A qué hora sale el tren?","À quelle heure part le train ?"],["sofia","Sale a las diez y cuarto del andén cuatro. ¡Y no encuentro mi billete!","Il part à dix heures et quart, quai quatre. Et je ne trouve pas mon billet !"],["lucia","Mirá… ¡está en tu mano!","Regarde… il est dans ta main !"],["sofia","¡Ay, qué despistada soy! Gracias, Lucía. ¡Hasta la vuelta!","Oh, que je suis tête en l'air ! Merci, Lucía. À mon retour !"]],"preguntas":[["Où va Sofía ?",["À Madrid","À Barcelone","À Buenos Aires"],1],["Comment voyage-t-elle ?",["En avion","En bus","En train"],2],["Où est le billet de Sofía ?",["Dans la valise","Dans sa main","À la maison"],1]]}},{"id":"tiendas","nombre":"Las Tiendas","icono":"i-abanico","nivel":4,"guia":"lucia","tema":"Les vêtements et les achats","pista":"p-comparar","intro":["¡Me encanta ir de tiendas! ¿Me ayudás a elegir?","J'adore faire les magasins ! Tu m'aides à choisir ?"],"cultura":"On ne paie pas avec la même monnaie partout : **el euro** en Espagne, **el peso** en Argentine, au Mexique et en Colombie, **el sol** au Pérou. Le vocabulaire change aussi : un tee-shirt se dit **una camiseta** en Espagne mais **una remera** en Argentine !","palabras":[["la lanca","blanc, blanche","⚪","Las zapatillas blancas son bonitas.","Les baskets blanches sont jolies."]],"episodio":{"titulo":"La chaqueta perfecta","lineas":[["lucia","Valentina, ¿qué te parece esta chaqueta?","Valentina, qu'est-ce que tu penses de cette veste ?"],["valentina","Es bonita, pero es muy cara. Cuesta ochenta euros.","Elle est jolie, mais elle est très chère. Elle coûte quatre-vingts euros."],["lucia","¿Y esa chaqueta azul? Es más barata que la roja.","Et cette veste bleue ? Elle est moins chère que la rouge."],["valentina","Sí, cuesta treinta euros. ¿Qué talla tienes?","Oui, elle coûte trente euros. Quelle taille fais-tu ?"],["lucia","La M. Voy a probármela.","Du M. Je vais l'essayer."],["valentina","¡Te queda genial! Es perfecta con tus zapatillas blancas.","Elle te va super bien ! Elle est parfaite avec tes baskets blanches."],["lucia","Entonces me la llevo. ¿Puedo pagar con tarjeta?","Alors je la prends. Je peux payer par carte ?"],["valentina","¡Claro! Y después vamos a la terraza.","Bien sûr ! Et après, on va à la terrasse."]],"preguntas":[["Combien coûte la veste rouge ?",["30 €","50 €","80 €"],2],["Quelle veste Lucía achète-t-elle ?",["La rouge","La bleue","La blanche"],1],["Quelle taille fait Lucía ?",["S","M","L"],1]]}},{"id":"salud","nombre":"El Centro de Salud","icono":"i-cactus","nivel":4,"guia":"diego","tema":"Le corps, la santé, les émotions","pista":"p-serestar","intro":["¡Ay, mi pie! Acompáñame al centro de salud, por favor.","Aïe, mon pied ! Accompagne-moi au centre de santé, s'il te plaît."],"cultura":"Pour dire « j'ai mal », l'espagnol utilise **doler** comme **gustar** : **me duele la cabeza**, **me duelen los pies**. En Espagne, la pharmacie se repère à sa croix verte, comme en France. Au Mexique, on dit **enojado** plutôt que **enfadado** pour « fâché ».","palabras":[["la cabeza","la tête","🤕","Me duele la cabeza.","J'ai mal à la tête."],["el brazo","le bras","💪","Tengo el brazo roto.","J'ai le bras cassé."],["la pierna","la jambe","🦵","Me duele la pierna derecha.","J'ai mal à la jambe droite."],["el pie","le pied","🦶","Me duele mucho el pie.","J'ai très mal au pied."],["la mano","la main","✋","Levanta la mano.","Lève la main."],["la espalda","le dos","🧍‍♂️","Mi mochila pesa y me duele la espalda.","Mon sac pèse lourd et j'ai mal au dos."],["el estómago","l'estomac, le ventre","🤢","Me duele el estómago.","J'ai mal au ventre."],["los ojos","les yeux","👀","Tengo los ojos verdes.","J'ai les yeux verts."],["la boca","la bouche","👄","Abre la boca, por favor.","Ouvre la bouche, s'il te plaît."],["me duele","j'ai mal à","😣","Me duele el pie.","J'ai mal au pied."],["estar enfermo / enferma","être malade","🤒","Hoy estoy enfermo.","Aujourd'hui, je suis malade."],["el médico / la médica","le médecin","🩺","Voy al médico esta tarde.","Je vais chez le médecin cet après-midi."],["la farmacia","la pharmacie","💊","La farmacia está en la plaza.","La pharmacie est sur la place."],["descansar","se reposer","🛌","Tienes que descansar.","Tu dois te reposer."],["contento / contenta","content, contente","😊","Hoy estoy muy contenta.","Aujourd'hui, je suis très contente."],["triste","triste","😢","Diego está triste.","Diego est triste."],["cansado / cansada","fatigué, fatiguée","🥱","Estoy cansado después del partido.","Je suis fatigué après le match."],["nervioso / nerviosa","nerveux, stressé","😬","Estoy nerviosa antes del examen.","Je suis stressée avant l'examen."],["enfadado / enfadada","fâché, fâchée","😠","Mi padre está enfadado.","Mon père est fâché."],["tener miedo","avoir peur","😨","Tengo miedo de los perros.","J'ai peur des chiens."],["tener hambre","avoir faim","🤤","¡Tengo mucha hambre!","J'ai très faim !"],["tener sed","avoir soif","🥤","Después de correr, tengo sed.","Après avoir couru, j'ai soif."]],"episodio":{"titulo":"El pie de Diego","lineas":[["medica","Hola, Diego. ¿Qué te pasa?","Bonjour, Diego. Qu'est-ce qui t'arrive ?"],["diego","Me duele mucho el pie. Es por el partido de fútbol.","J'ai très mal au pied. C'est à cause du match de foot."],["medica","A ver… No está roto. Pero tienes que descansar.","Voyons… Il n'est pas cassé. Mais tu dois te reposer."],["diego","¿Descansar? ¿Y el partido del sábado?","Me reposer ? Et le match de samedi ?"],["medica","Nada de fútbol durante una semana.","Pas de foot pendant une semaine."],["diego","Estoy muy triste… y un poco enfadado.","Je suis très triste… et un peu fâché."],["medica","Es normal. Pero eres fuerte, Diego. ¡En siete días, a jugar!","C'est normal. Mais tu es fort, Diego. Dans sept jours, tu rejoues !"],["diego","Vale, doctora. ¡Gracias!","D'accord, docteure. Merci !"]],"preguntas":[["Où Diego a-t-il mal ?",["À la tête","Au pied","Au dos"],1],["Que doit-il faire ?",["Se reposer","Aller à la pharmacie","Courir"],0],["Combien de temps sans football ?",["Trois jours","Une semaine","Un mois"],1]]}},{"id":"radio","nombre":"Radio Barrio","icono":"i-guitarra","nivel":3,"guia":"pablo","tema":"Les médias, la technologie, l'avenir","pista":"p-futuro","intro":["¡Silencio, estamos en directo! Bienvenido a Radio Barrio.","Silence, on est en direct ! Bienvenue sur Radio Barrio."],"cultura":"La radio reste très écoutée dans le monde hispanique. En Colombie, des **radios comunitarias** informent les villages des montagnes et de l'Amazonie, souvent loin de tout. Et selon les pays, ton portable s'appelle **el móvil** (Espagne) ou **el celular** (Amérique latine), ton ordinateur **el ordenador** ou **la computadora**.","palabras":[["la radio","la radio","📻","Escucho la radio por la mañana.","J'écoute la radio le matin."],["el programa","l'émission","🎙️","El programa empieza a las cinco.","L'émission commence à cinq heures."],["la noticia","la nouvelle, l'info","📰","Leo las noticias en el móvil.","Je lis les infos sur mon portable."],["el periodista / la periodista","le / la journaliste","🎤","Quiero ser periodista.","Je veux être journaliste."],["la entrevista","l'interview","🗨️","Hoy hacemos una entrevista.","Aujourd'hui, nous faisons une interview."],["el móvil / el celular","le portable (Espagne / Amérique)","📱","Mi móvil no tiene batería.","Mon portable n'a plus de batterie."],["la pantalla","l'écran","🖥️","Paso mucho tiempo delante de la pantalla.","Je passe beaucoup de temps devant l'écran."],["el ordenador / la computadora","l'ordinateur (Espagne / Amérique)","💻","Hago los deberes con el ordenador.","Je fais mes devoirs sur l'ordinateur."],["las redes sociales","les réseaux sociaux","🌐","Mis padres no usan las redes sociales.","Mes parents n'utilisent pas les réseaux sociaux."],["el mensaje","le message","💬","Te mando un mensaje esta noche.","Je t'envoie un message ce soir."],["la contraseña","le mot de passe","🔑","No compartas tu contraseña.","Ne partage pas ton mot de passe."],["descargar","télécharger","⬇️","Voy a descargar la aplicación.","Je vais télécharger l'application."],["compartir","partager","🔁","Antes de compartir, hay que pensar.","Avant de partager, il faut réfléchir."],["subir","publier, mettre en ligne","⬆️","Pablo sube un vídeo cada semana.","Pablo met une vidéo en ligne chaque semaine."],["el vídeo","la vidéo","🎬","Este vídeo es muy divertido.","Cette vidéo est très drôle."],["el seguidor / la seguidora","l'abonné, l'abonnée","👥","La radio tiene mil seguidores.","La radio a mille abonnés."],["la inteligencia artificial","l'intelligence artificielle","🤖","La inteligencia artificial nos ayudará.","L'intelligence artificielle nous aidera."],["el robot","le robot","🦾","En el futuro habrá robots en casa.","À l'avenir, il y aura des robots à la maison."],["el futuro","l'avenir, le futur","🔮","¿Cómo será el futuro?","Comment sera l'avenir ?"],["la privacidad","la vie privée","🔒","Hay que proteger la privacidad.","Il faut protéger la vie privée."],["la noticia falsa","la fausse information","⚠️","Esta noticia falsa circula en las redes.","Cette fausse info circule sur les réseaux."],["estar conectado / conectada","être connecté(e)","📶","Estoy conectado todo el día.","Je suis connecté toute la journée."]],"episodio":{"titulo":"La vida en 2050","lineas":[["pablo","¡Buenas tardes! Estáis escuchando Radio Barrio. Hoy hablamos del futuro.","Bonjour ! Vous écoutez Radio Barrio. Aujourd'hui, on parle de l'avenir."],["pablo","Sofía, ¿cómo será la vida en 2050?","Sofía, comment sera la vie en 2050 ?"],["sofia","Creo que la inteligencia artificial nos ayudará mucho, en el instituto y en el hospital.","Je crois que l'intelligence artificielle nous aidera beaucoup, au collège et à l'hôpital."],["pablo","¿Y los móviles? ¿Pasaremos el día delante de la pantalla?","Et les portables ? On passera la journée devant l'écran ?"],["sofia","Espero que no… Tendremos que proteger nuestra privacidad.","J'espère que non… Nous devrons protéger notre vie privée."],["pablo","Y también tendremos que verificar las noticias. Hay muchas noticias falsas en las redes sociales.","Et nous devrons aussi vérifier les infos. Il y a beaucoup de fausses infos sur les réseaux sociaux."],["sofia","Exacto. Antes de compartir, ¡hay que pensar!","Exactement. Avant de partager, il faut réfléchir !"],["pablo","Gracias, Sofía. ¡Hasta mañana, queridos oyentes!","Merci, Sofía. À demain, chers auditeurs !"]],"preguntas":[["Quel est le thème de l'émission ?",["Le passé","L'avenir","Le sport"],1],["Selon Sofía, l'intelligence artificielle…",["aidera au collège et à l'hôpital","remplacera les profs","sera interdite"],0],["Que faut-il faire avant de partager ?",["Télécharger","Réfléchir","S'abonner"],1]]}},{"id":"museo","nombre":"El Museo","icono":"i-azulejo","nivel":3,"guia":"pablo","tema":"L'art, l'histoire, le passé","pista":"p-indefinido","intro":["En el museo descubrimos el pasado… y a grandes artistas.","Au musée, on découvre le passé… et de grands artistes."],"cultura":"**El Guernica**, peint par Pablo Picasso en 1937 après le bombardement de la ville basque de Guernica, est exposé au **museo Reina Sofía** de Madrid. En Colombie, **Fernando Botero** est célèbre pour ses personnages aux ier","🗓️","El año pasado viajé a México.","L'an dernier, j'ai voyagé au Mexique."],["famoso / famosa","célèbre","⭐","Es un cuadro muy famoso.","C'est un tableau très célèbre."],["el guía / la guía","le guide, la guide","🧭","La guía explica el cuadro.","La guide explique le tableau."]],"episodio":{"titulo":"De Picasso a Botero","lineas":[["pablo","Mateo, ¿qué hiciste el fin de semana?","Mateo, qu'est-ce que tu as fait ce week-end ?"],["mateo","Fui al Museo Reina Sofía con mi clase. Vi el Guernica de Picasso.","Je suis allé au musée Reina Sofía avec ma classe. J'ai vu Guernica de Picasso."],["pablo","¡Qué suerte! ¿Te gustó?","Quelle chance ! Ça t'a plu ?"],["mateo","Sí, mucho. Picasso lo pintó en 1937. Representa la guerra y el dolor.","Oui, beaucoup. Picasso l'a peint en 1937. Il représente la guerre et la douleur."],["pablo","Yo, el año pasado, visité el Museo Botero en Bogotá.","Moi, l'an dernier, j'ai visité le musée Botero à Bogotá."],["mateo","¿Botero? ¿El pintor de las figuras grandes y redondas?","Botero ? Le peintre des personnages grands et ronds ?"],["pablo","¡Exacto! Nació en Medellín y es muy famoso en Colombia.","Exactement ! Il est né à Medellín et il est très célèbre en Colombie."],["mateo","¡Un día vamos a visitar ese museo juntos!","Un jour, on visitera ce musée ensemble !"]],"preguntas":[["Qu'a vu Mateo au musée ?",["Guernica de Picasso","Un tableau de Botero","Une pyramide maya"],0],["Quand Guernica a-t-il été peint ?",["En 1907","En 1937","En 1982"],1],["Où Pablo a-t-il visité le musée Botero ?",["À Madrid","À Medellín","À Bogotá"],2]]}},{"id":"huerto","nombre":"El Huerto","icono":"i-aceite","nivel":3,"guia":"sofia","tema":"L'environnement","pista":"p-obligacion","intro":["En el huerto cuidamos la tierra. ¿Me echas una mano?","Au potager, on prend soin de la terre. Tu me donnes un coup de main ?"],"cultura":"Le sud de l'Espagne connaît des **sequías** (sécheresses) de plus en plus fréquentes. Beaucoup de villes créent des **huertos urbanos**, des es transports en commun","🚋","Uso el transporte público.","J'utilise les transports en commun."],["sostenible","durable","💚","Queremos un barrio sostenible.","Nous voulons un quartier durable."],["cuidar","prendre soin de","🫶","Tenemos que cuidar el planeta.","Nous devons prendre soin de la planète."],["hay que","il faut","☝️","Hay que reciclar el plástico.","Il faut recycler le plastique."],["tener que","devoir","📌","Tengo que regar las plantas.","Je dois arroser les plantes."]],"episodio":{"titulo":"Un huerto para todos","lineas":[["sofia","Diego, ¡ven a ayudarme en el huerto del barrio!","Diego, viens m'aider au potager du quartier !"],["diego","Vale. ¿Qué hay que hacer?","D'accord. Qu'est-ce qu'il faut faire ?"],["sofia","Hay que plantar tomates y regar las plantas. Pero tenemos que ahorrar agua.","Il faut planter des tomates et arroser les plantes. Mais nous devons économiser l'eau."],["diego","Claro, en Sevilla hay mucha sequía en verano.","Bien sûr, à Séville, il y a beaucoup de sécheresse en été."],["sofia","Por eso recogemos el agua de la lluvia. Y aquí no usamos plástico.","C'est pour ça qu'on récupère l'eau de pluie. Et ici, on n'utilise pas de plastique."],["diego","¿Y la basura de la cocina?","Et les déchets de cuisine ?"],["sofia","Hacemos compost. Todos debemos proteger el planeta.","On fait du compost. Nous devons tous protéger la planète."],["diego","¡Me gusta este huerto! Vuelvo el sábado.","J'aime ce potager ! Je reviens samedi."]],"preguntas":[["Que faut-il planter ?",["Des tomates","Des oranges","Des pommes de terre"],0],["Quel problème y a-t-il à Séville en été ?",["Les inondations","La sécheresse","La neige"],1],["Que font-ils des déchets de cuisine ?",["Ils les jettent","Du compost","Ils les brûlent"],1]]}},{"id":"ayuntamiento","nombre":"El Ayuntamiento","icono":"i-castillo","nivel":3,"guia":"sofia","tema":"La citoyenneté et le débat","pista":"p-opinion","intro":["Hoy hay consejo de jóvenes en el ayuntamiento. ¡Tu opinión cuenta!","Aujourd'hui, il y a conseil des jeunes à la mairie. Ton avis compte !"],"cultura":"Dans le monde hispanique, beaucoup de villes ont un **consejo de jóvenes** où les adolescents proposent des projets pour leur quartier. En Espagne, on vote à partir de 18 ans ; en Argentine, on peut voter **dès 16 ans**.","palabras":[["el ayuntamiento","la mairie","🏰","El ayuntamiento está en la plaza.","La mairie est sur la place."],["el alcalde / la alcaldesa","le maire, la maire","🎩","La alcaldesa escucha a los jóvenes.","La maire écoute les jeunes."],["el ciudadano / la ciudadana","le citoyen, la citoyenne","🧑‍🤝‍🧑","Todos somos ciudadanos.","Nous sommes tous citoyens."],["votar","voter","🗳️","En Argentina se puede votar a los dieciséis años.","En Argentine, on peut voter à seize ans."],["la ley","la loi","⚖️","La ley es igual para todos.","La loi est la même pour tous."],["el derecho","le droit","📜","Todos tenemos derecho a la educación.","Nous avons tous droit à l'éducation."],["la igualdad","l'égalité","🟰","Defendemos la igualdad entre chicos y chicas.","Nous défendons l'égalité entre garçons et filles."],["la libertad","la liberté","🗽","La libertad de expresión es importante.","La liberté d'expression est importante."],["el debate","le débat","🗣️","Hoy tenemos un debate en clase.","Aujourd'hui, nous avons un débat en classe."],["la opinión","l'opinion, l'avis","💭","Respeto tu opinión.","Je respecte ton avis."],["creo que","je crois que","💡","Creo que es una buena idea.","Je crois que c'est une bonne idée."],["pienso que","je pense que","🧠","Pienso que tienes razón.","Je pense que tu as raison."],["en mi opinión","à mon avis","🙋","En mi opinión, hay mucho ruido.","À mon avis, il y a beaucoup de bruit."],["estoy de acuerdo","je suis d'accord","👍","Estoy de acuerdo contigo.","Je suis d'accord avec toi."],["no estoy de acuerdo","je ne suis pas d'accord","👎","No estoy de acuerdo con esa idea.","Je ne suis pas d'accord avec cette idée."],["sin embargo","cependant","↔️","Es buena idea; sin embargo, es cara.","C'est une bonne idée ; cependant, elle coûte cher."],["además","de plus","➕","Además, es bueno para la salud.","De plus, c'est bon pour la santé."],["por eso","c'est pourquoi","➡️","Hay mucho ruido. Por eso propongo cerrar la plaza.","Il y a beaucoup de bruit. C'est pourquoi je propose de fermer la place."],["porque","parce que","❓","Voto sí porque es justo.","Je vote oui parce que c'est juste."],["el problema","le problème","🚨","El tráfico es un problema.","La circulation est un problème."],["la solución","la solution","✅","Tenemos una solución.","Nous avons une solution."],["proponer","proposer","📝","Propongo crear un carril bici.","Je propose de créer une piste cyclable."]],"episodio":{"titulo":"¿Una plaza sin coches?","lineas":[["sofia","Bienvenidos al consejo de jóvenes. Hoy debatimos: ¿hay que cerrar la plaza a los coches?","Bienvenue au conseil des jeunes. Aujourd'hui, nous débattons : faut-il fermer la place aux voitures ?"],["mateo","En mi opinión, sí. Hay mucha contaminación y mucho ruido.","À mon avis, oui. Il y a beaucoup de pollution et beaucoup de bruit."],["lucia","No estoy de acuerdo. Mi abuela necesita el coche para ir al médico.","Je ne suis pas d'accord. Ma grand-mère a besoin de la voiture pour aller chez le médecin."],["diego","Es verdad. Sin embargo, sin coches los niños pueden jugar sin peligro.","C'est vrai. Cependant, sans voitures, les enfants peuvent jouer sans danger."],["sofia","¿Qué solución proponéis?","Quelle solution proposez-vous ?"],["mateo","Propongo cerrar la plaza los fines de semana. Además, podemos crear un carril bici.","Je propose de fermer la place le week-end. De plus, on peut créer une piste cyclable."],["lucia","Eso me parece bien. Así todos ganamos.","Ça me semble bien. Comme ça, tout le monde y gagne."],["sofia","Muy bien. ¡Vamos a votar!","Très bien. Passons au vote !"]],"preguntas":[["Quel est le sujet du débat ?",["Fermer la place aux voitures","Construire un stade","Changer les horaires du collège"] "tú","tienes","tu / tus"],["él / ella","tiene","su / sus"],["nosotros","tenemos","nuestro, nuestra…"],["vosotros","tenéis","vuestro, vuestra…"],["ellos / ellas","tienen","su / sus"]],"ejemplos":[["Tengo un gato negro.","J'ai un chat noir."],["Mis abuelos viven en Puebla.","Mes grands-parents vivent à Puebla."],["¿Cuántos años tienes?","Quel âge as-tu ?"]],"ejercicio":[["Yo ___ un hermano.",["tengo","tienes","tiene"],0,"J'ai un frère."],["¿Cuántos años ___ tú?",["tengo","tienes","tienen"],1,"Quel âge as-tu ?"],["Valentina ___ un gato.",["tiene","tienes","tenemos"],0,"Valentina a un chat."],["___ padres trabajan mucho.",["Mi","Mis","Tu"],1,"Mes parents travaillent beaucoup."],["¿Cómo se llama ___ perro, Diego?",["tu","tus","mis"],0,"Comment s'appelle ton chien, Diego ?"],["Nosotros ___ una casa pequeña.",["tienen","tenemos","tenéis"],1,"Nous avons une petite maison."]]},{"id":"p-ar","nivel":5,"lugar":"instituto","titulo":"Le présent des verbes en -AR","explica":["La plupart des verbes espagnols se terminent par **-ar** : *estudiar, hablar, escuchar*. Pour les conjuguer au présent, on enlève **-ar** et on ajoute les terminaisons.","Pas besoin de pronom sujet : la terminaison suffit ! *Estudio* veut déjà dire « j'étudie »."],"tabla":[["","estudiar"],["yo","estudi**o**"],["tú","estudi**as**"],["él / ella","estudi**a**"],["nosotros","estudi**amos**"],["vosotros","estudi**áis**"],["ellos / ellas","estudi**an**"]],"ejemplos":[["Hablo español en clase.","Je parle espagnol en classe."],["¿Escuchas música?","Tu écoutes de la musique ?"],["Estudiamos juntos en el recreo.","Nous travaillons ensemble à la récré."]],"ejercicio":[["Yo ___ inglés.",["estudio","estudias","estudia"],0,"J'étudie l'anglais."],["Tú ___ muy bien.",["hablo","hablas","hablan"],1,"Tu parles très bien."],["La profesora ___ la lección.",["explico","explicas","explica"],2,"La prof explique la leçon."],["Nosotros ___ música.",["escuchamos","escucháis","escuchan"],0,"Nous écoutons de la musique."],["Pablo y Mateo ___ en la biblioteca.",["estudia","estudiamos","estudian"],2,"Pablo et Mateo étudient à la bibliothèque."],["¿Vosotros ___ español?",["habláis","hablamos","hablan"],0,"Vous parlez espagnol ?"]]},{"id":"p-gustar","nivel":5,"lugar":"mercado","titulo":"Gustar : me gusta, me gustan","explica":["**Gustar** fonctionne à l'envers du français : *me gusta el chocolate* veut dire mot à mot « le chocolat me plaît ».","Si ce qui plaît est au singulier ou un verbe, on dit **gusta**. Si c'est au pluriel, on dit **gustan**. Pour dire qu'on adore, **encantar** marche pareil : *me encantan las naranjas.*"],"tabla":[["à qui ?","+ singulier ou verbe","+ pluriel"],["(a mí) me","gusta","gustan"],["(a ti) te","gusta","gustan"],["(a él / ella) le","gusta","gustan"],["(a nosotros) nos","gusta","gustan"],["(a vosotros) os","gusta","gustan"],["(a ellos) les","gusta","gustan"]],"ejemplos":[["Me gusta el pan.","J'aime le pain."],["Me encantan las naranjas.","J'adore les oranges."],["¿Te gusta cocinar?","Tu aimes cuisiner ?"]],"ejercicio":[["Me ___ el chocolate.",["gusta","gustan"],0,"J'aime le chocolat."],["Me ___ las manzanas.",["gusta","gustan"],1,"J'aime les pommes."],["¿Te ___ cocinar?",["gusta","gustan"],0,"Tu aimes cuisiner ?"],["A Valentina ___ gustan los tacos.",["me","te","le"],2,"Valentina aime les tacos."],["A nosotros ___ encanta el mercado.",["nos","os","les"],0,"Nous adorons le marché."],["No me ___ los tomates.",["gusta","gustan"],1,"Je n'aime pas les tomates."]]},{"id":"p-diptongo","nivel":4,"lugar":"parque","titulo":"Les verbes qui changent : o → ue, e → ie","explica":["Certains verbes changent de voyelle au présent : **o → ue** (*poder → puedo*), **e → ie** (*querer → quiero, preferir → prefiero*). **Jugar** fait **u → ue** : *juego*.","Le changement ne se fait pas avec **nosotros** et **vosotros** : *podemos, queremos, jugamos*. Si tu entoures les formes qui changent dans le tableau, tu obtiens une botte : on les appelle les verbes « botte »."],"tabla":[["","jugar","poder","querer"],["yo","j**ue**go","p**ue**do","qu**ie**ro"],["tú","j**ue**gas","p**ue**des","qu**ie**res"],["él / ella","j**ue**ga","p**ue**de","qu**ie**re"],["nosotros","jugamos","podemos","queremos"],["vosotros","jugáis","podéis","queréis"],["ellos / ellas","j**ue**gan","p**ue**den","qu**ie**ren"]],"ejemplos":[["Juego al fútbol todos los días.","Je joue au foot tous les jours."],["¿Quieres ver el partido?","Tu veux voir le match ?"],["Podemos jugar en el parque.","Nous pouvons jouer au parc."]],"ejercicio":[["Yo ___ al fútbol.",["jugo","juego","jugamos"],1,"Je joue au foot."],["¿___ venir al parque?",["Puedes","Podes","Podéis"],0,"Tu peux venir au parc ?"],["Mateo ___ el baloncesto.",["prefere","prefiere","preferimos"],1,"Mateo préfère le basket."],["Nosotros ___ jugar.",["queremos","quieremos","quieren"],0,"Nous voulons jouer."],["Diego y Mateo ___ al fútbol.",["juegan","jugan","jugamos"],0,"Diego et Mateo jouent au foot."],["Hoy no ___ jugar, estoy cansado.",["podo","puedo","puede"],1,"Aujourd'hui, je ne peux pas jouer, je suis fatigué."]]},{"id":"p-pronominal","nivel":4,"lugar":"terraza","titulo":"Les verbes pronominaux et l'heure","explica":["Les verbes de la routine sont souvent **pronominaux** : *levantarse* (se lever), *ducharse* (se doucher). Le pronom se place devant le verbe conjugué : **me** levanto, **te** levantas, **se** levanta, **nos** levantamos, **os** levantáis, **se** levantan.","Pour l'heure : **Es la una** (il est une heure), mais **Son las dos, las tres…** On ajoute **y cuarto**, **y media**, **menos cuarto**. Pour dire « à » telle heure : **a las ocho**."],"tabla":[["","levantarse","acostarse (o → ue)"],["yo","me levanto","me acuesto"],["tú","te levantas","te acuestas"],["él / ella","se levanta","se acuesta"],["nosotros","nos levantamos","nos acostamos"],["vosotros","os levantáis","os acostáis"],["ellos / ellas","se levantan","se acuestan"]],"ejemplos":[["Me levanto a las siete.","Je me lève à sept heures."],["Son las tres menos cuarto.","Il est
